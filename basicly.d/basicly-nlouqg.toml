# `frozenset` constant instead of a literal would need no test at all, and it breaks
# `tree_schema._evaluate`, which reads this schema statically and models only literals,
# `frozenset(...)` and `Table(...)` — an unreadable `CONFIG_SCHEMA` falls back to the
# running engine's and prints the ordering rule (basicly-69az), which is a live regression
# for a lane landing a schema change. Putting the walk in a new test module would keep this
# suite at its baseline and split `CONFIG_SCHEMA`'s declaration gates across two files, one
# of which no reader looking at the schema would find. Trimming the narration to fit is the
# one route the ratchets exist to refuse; the only dead weight found was an unused
# `_COMPOSE_RATCHET` constant and the two nested conditionals ruff's SIM102 named, which
# together paid back 53 of the 961 tokens the first draft needed. The 908 is the measured
# figure and not a round one: an over-declared rebaseline licenses the growth it overshoots
# by, which is the silent loosening this table exists to make countable.
