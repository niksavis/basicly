# (basicly-nlouqg). `code_citations` and `release_notes` both called
# `ratchet.compose_ratchet` under a section this schema refused, so each gate's own
# rebaseline remedy pointed a lane at a file that would then fail every command that reads
# the config. Measured 2026-08-20 on this tree: a `basicly.d` fragment declaring
# `[ratchet.code_citations]` was refused before the change and is accepted after, while
# `[ratchet.not_a_gate]` is still refused — the schema stayed strict.
#
# `src/basicly/config.py` needs no entry: 23765 -> 23918 tokens against a frozen 24203, and
# the prose share moved 48.3 -> 48.5 under the 50% cap, so the two table lines and the
# comment stating why the list has to be complete both fit.
#
# `tests/test_config.py` 18221 -> 19129, rebaselined by 908 against a baseline it sat
# exactly on. The addition is the coverage gate itself: it parses every `.py` under
# `.scripts/` and `src/basicly/` for `compose_ratchet` calls, resolves each call's gate
# argument through the module-level constant the gate spells it as, and names the file that
# asked for a section the schema omits. `tests/` is excluded from that walk on purpose, so
# `test_ratchet.py`'s fixture gate is not demanded of the schema.
