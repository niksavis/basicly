# `_refuse_unbounded` and `_text_size`, plus the `kind` keyword `append` now passes through
# `prepare_payload`. The declaration is the deliverable: a bound is now a property of the kind,
# `created` and `artifact` declare their payload stored whole for stated reasons, and a kind that
