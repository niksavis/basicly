[ratchet.module_size]
rebaseline_reason = "the routing layer is where an outcome is judged, and every unit added reaches LaneOutcome/_unstarted, which live in this module; three of the five are extractions the C901 and PLR0912 gates required because both functions sat exactly on their limit, and the placeable half went to the new provider_limit.py, which took runner.py down 91 tokens on the way"

[ratchet.module_size.rebaselined]
"src/basicly/supervise.py" = 1737

# ## comment_density: one waiver, bought on cohesion
#
# `src/basicly/provider_limit.py` at 66.4% against the 50% cap, on 380 tokens of code -
# four short total functions. What the module *is* is a discriminator plus the provenance
# that fixes it: which vendor sentence was captured and how often ("You've hit your session
