# The confirm-code store's read-modify-write is serialised (basicly-kas8q7).
#
# Two processes minting or consuming confirm codes each read the store before either
# wrote it, and the second write dropped the first entry. Measured on this head with the
# lock removed: of two writers, exactly one key survives.
#
# The lock is `base_lock.hold_file`, the base checkout's queue with its budgets and its
# refusal's wording lifted into parameters, rather than a second `O_EXCL` loop in
# `policy.py`. A second loop was written first and had all three of the windows
# `base_lock` closed on windows (basicly-s2obqz): no delete-pending retry on the create,
# a steal by `unlink` that two waiters can both win, and no retry on the release.
#
# ## module_size: policy.py rebaselined by 97
#
# What the 97 buys: two named budgets, the `_confirm_store_lock` wrapper both call sites
# take, and the indentation of the two guarded bodies. The mechanism itself is +581 in
# `base_lock.py` (2116 of 4000) and its tests +304 in `test_base_lock.py` (3748 of 4000),
# both paid out of headroom, so only the call site is banked here.
#
# Rebaselined rather than waived: a waiver would delete `policy.py`'s 32482-token
# ceiling, 8x the cap, to buy 97 tokens. No prose was cut to pay for it — the gate's own
# graduated remedy asks a module this far over only not to grow, and the store's split
# out of `policy.py` is blocked on the docs that cite `policy._CONFIRM_FILE` and
# `policy.CONFIRM_TTL_SECONDS`, which this record does not scope.
#
# `tests/test_policy.py` needs no rebaseline: both tests are in a new
# `tests/test_policy_confirm_store.py` under the §9.4 `test_<module>_<aspect>` form, and
# unlike basicly-i8urje's case that split costs no duplicated fixture — the tests use
# none of `test_policy.py`'s preamble.
