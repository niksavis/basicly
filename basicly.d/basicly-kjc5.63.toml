# The base checkout's tracker commit is serialised, so four concurrent dispatches stop
# racing it (basicly-kjc5.63). The mechanism is a new module — `src/basicly/base_lock.py`,
# 1430 tokens, well inside the cap — and `merge.py` pays only for reaching it. Both files
# were measured before the first edit: merge.py had **2** tokens of module-size headroom
# and 0.4 points of comment-density room, which is why the narration went into the new
# module rather than beside the call.
#
# `merge.py` +190: the `wait_s` keyword (a caller's queue budget, which ruff then splits
# across five lines), the `with base_lock.hold(...)` funnel, and the `_commit_tracker_state`
# body it now wraps. No prose was cut to pay for it and none was needed to: the module's
# prose share went 60.5 -> 60.4 against its frozen 60.7, because what landed is code plus
# one paragraph shorter than the code it explains.
#
# **+192, not +190, and the two extra tokens are a composition error worth naming.** This
# lane branched before `basicly-gvlpxm` landed, so both lanes measured `merge.py` against
# the same 15401 baseline and both found **exactly 2 tokens** of headroom. gvlpxm declared
# +79 and spent that 2; this lane declared +190 and spent it again. Composed on the rebase
# the module reads 15672 against a frozen 15401 + 79 + 190 = 15670, so the gate refused by
# 2 and `test_check_module_size` failed with it — green on both parents, red on the merge.
# Nothing was cut and nothing needed to be: the declared delta is corrected to the measured
# one. The transferable part is that a headroom figure is only valid against the tree it was
# taken on, and two lanes may not both spend the last of it.
[ratchet.module_size]
rebaseline_reason = "the base-checkout lock's funnel in a module with 2 tokens of headroom; the mechanism itself is a new module"

[ratchet.module_size.rebaselined]
"src/basicly/merge.py" = 192
