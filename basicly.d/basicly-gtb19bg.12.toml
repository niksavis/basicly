[verify]
jobs = "auto"

[[verify.checks]]
name = "docs-index"
command = ["uv", "run", "python", "-m", "pytest", "tests/test_docs_index.py", "tests/test_docs_drift.py", "tests/test_harness_loop_skill.py", "-q"]
modes = ["fast", "staged"]
inputs = ["docs/**/*.md", ".basicly/core/skills/harness-loop/**", "basicly.toml", "basicly.d/*.toml", "tests/test_docs_index.py", "tests/test_docs_drift.py", "tests/test_harness_loop_skill.py", "pyproject.toml", "uv.lock"]
