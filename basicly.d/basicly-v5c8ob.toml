# Section 34's tier and band counts are now a `docs-claims` generated block over
# `.importlinter` rather than three numbers a lane corrects by hand (basicly-h7bknm). The
# derivation lives in `.scripts/docs_claim_layers.py`, a fifth sibling of the claim modules
# `docs_claims.py` already imports, so it carries the same `E402` those four carry and for the
# same reason: `.scripts` is not a package, the sibling is reachable only after `sys.path`
# names its directory, and the import therefore cannot precede the statement that makes it
# resolvable. The alternative rejected was folding the derivation into `docs_claims.py`, which
# has 500 tokens of module-size headroom against a frozen 5567 and would have needed about
# 2900. The suppression names its reason, so `unreasoned_count` does not move.
[ratchet.noqa_debt.frozen]
E402 = 1

# Two live code citations repaired by finding their target (basicly-fsuhg3), in two modules
# that were frozen at exactly their own size. `tests/test_policy.py` cited a document deleted
# on 2026-08-08 and now cites the section that absorbed it; the shipped kit's `events.py`
# named `work-tracker.md` in its header and then wrote three architecture section numbers, so
# each citing line now names the document its number belongs to. Naming the document is the
# repair the gate asks for and the only one that keeps the pointer: the alternative, a
# full-path binding, would have re-attributed every one of `events.py`'s bare marks to the
# architecture when most of them really do mean `work-tracker.md`. Both frozen entries
# graduated at zero in the same diff. 18 tokens and 35 tokens of document names, measured.
