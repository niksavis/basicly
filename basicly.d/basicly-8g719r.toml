# replaced the ancestry test. Almost none of it is new branching: the old block already
# had the `show-ref` fail-closed path, and what grew is the four *distinct* reasons a
# branch is now kept — base lacks paths, the comparison could not be made, no session
# names the base, git refused the delete outright — each of which has to be a different
# sentence to the operator, because the single sentence they replaced said `--force` to
