# Its prose share fell 46.1 -> 49.7 against the hard 50.0 cap, so it is *inside* the cap
# with 0.3 points to spare and takes no comment-density entry. That 0.3 is the reason the
# narration of what was *rejected* lives in this fragment instead of in the module.
#
# Alternatives rejected, measured in this order:
#   1. A new `branch_reclaim.py` on the `base_lock.py` pattern. This is the one that
#      looked right and does not survive measurement: the extracted block is ~1065
#      tokens of which the majority is the fail-closed narration, so a module holding it
#      alone lands *over* the 50 percent density cap, and buying a new over-cap module to
#      keep an existing under-cap one is moving a number, not extracting a
#      responsibility. worktree.py is also where the responsibility already lives —
