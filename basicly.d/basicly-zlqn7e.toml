# A failing check's own words now survive the terminal (basicly-zlqn7e). A `pytest` gate
# failed once, the artifact recorded only "output streamed rather than captured", six later
# runs of that command were green, and the flake's identity was gone. `run_check` now tees -
# it forwards each line exactly as before AND keeps it - and on failure writes the redacted
# tail to `.basicly/usage/verify-fail-<check>.log`, which the `detail` then names.
#
# ## module_size: two rebaselines
#
#   src/basicly/verify.py    5436 -> 6008   +572
#   tests/test_verify.py    15681 -> 16371  +690
#
# `verify.py` grew by one function. `subprocess.run` cannot tee, so the streamed path is a
# `Popen` line loop; the capture path stays `subprocess.run`. `_spawn` holds both, with the
# trust-boundary comment that was inline before, so the growth is the second branch and its
# reason and nothing else.
#
# `tests/test_verify.py` grew by an adapter and 16 rewritten patch sites. The tests stubbed
# `verify.subprocess.run`, which the tee no longer calls, so they now inject at the `_spawn`
# seam through `_as_spawn` - one helper, and it passes the kwargs they assert on unchanged.
# 27 sites were named before editing and 27 were rewritten, with zero `verify.subprocess`
# references left; the count reconciles.
#
# Banked rather than absorbed by cutting prose from `verify.py`, which is 56.6% narration
# about failure semantics that three other modules cite. Both entries are over the 4000 cap
# for reasons that predate this change.
[ratchet.module_size]
rebaseline_reason = "verify.run_check now tees so a failing check's output survives the terminal; subprocess.run cannot stream and capture at once, and the tests follow the new seam"

[ratchet.module_size.rebaselined]
"tests/test_verify.py" = 690
[ratchet.noqa_debt.frozen]
S603 = 1
