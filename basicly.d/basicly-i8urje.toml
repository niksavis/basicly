# derives `build` for a lane it did not seed (basicly-i8urje). `derive_phase` reads `build`
# off the binding alone; the hand path provisioned the tree, the branch, the dependencies
# and the hooks and recorded nothing, so three records landed green on main and every one
# had to be closed by hand, with no landing gate, no ship checkpoint and no release record.
#
# `src/basicly/cli.py` needs no rebaseline, but only just: 53717 -> 54323 against the frozen
# 54336, so 13 tokens are left. Prose share 26.4 -> 26.7 with no frozen entry and a 50.0 cap.
# No existing comment was cut to hold that number; the ~60 tokens taken back out of the
# change were restatements inside its own new docstring, and every claim it makes survives.
#
# `tests/test_worktree.py` +696 over its frozen 7562, the module having sat exactly on it.
# Three tests, one per criterion the record can assert at this layer, and each was shown to
# fail against a mutant of the fix before it was kept:
#
#   +~330  the demonstration: `worktree create` on a seeded record, then `read_node_state`
#          showing `build` and the binding, against a control record that is the same open
#          task with no worktree and still derives `intake`. Both halves fail with the
#          binding write removed.
#   +~200  the second-create refusal: a record already carrying a binding is refused before
#          provisioning, so neither a second binding nor a second tree appears. The held
