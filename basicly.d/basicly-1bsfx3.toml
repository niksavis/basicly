# The live snapshot names the dispatch a lane is running (basicly-1bsfx3).
#
# Measured 109 s into a live pass, a running lane row carried `branch, id, live, note,
# phase, provisioned, status, tokens` and none of `agent`, `model`, `started_at` or
# `elapsed_s` - all four of which the supervisor holds when it spawns the process. The
# card `basicly-0xtzf1` shipped therefore drew the title, the phase and the tokens alone
# on every first dispatch, because the only producer of those four was a run record that
# is written after the process stops.
#
# ## module_size: supervise.py rebaselined by 301
#
# What the 301 buys: `LaneStream` takes the agent, the model and both clocks at the spawn,
# `elapsed_s` subtracts the monotonic one, `inflight_dispatch` publishes the registry the
# two spend accessors already key on, and the dispatch site resolves the model it was
# going to resolve anyway. `board_facts` pays for the consumer half out of its own waived
# ceiling and `tests/test_supervise_board.py` paid for both tests out of headroom, after
# the existing `IN FLIGHT` case was folded onto the two helpers the new ones needed.
#
# Rebaselined rather than waived: a waiver would delete supervise.py's 49554-token
# ceiling - 12x the cap - to buy 301 tokens. No prose was cut to pay for it; the module's
# comment share is unchanged at its frozen 56.6%, so the gate that guards narration is
# still binding at exactly the number it was.
[ratchet]
base_commit = "1687bc87d8aeef5b5a5d836292403ff107332185"

