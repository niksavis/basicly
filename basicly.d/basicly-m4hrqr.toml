# What the change was: `_unfinished_beads`, one read of the ledger's statuses, and an
# `unfinished` field on `SpendAccuracy` carrying the beads it holds back. A forecast
# denominates a whole lane, so a bead that will be dispatched again folds to a part of the
# work; scoring that fold measures how far through the lane the pass has got. Measured
# during a live pass: `basicly-rv7q88` refused a commit at 0.088x on one finished attempt
# of 1,025,735 tokens against its lane's 11,610,753 forecast, and both remedies the gate
# printed were wrong there - the estimator did not produce that ratio, and freezing banks
# a partial measurement as history.
