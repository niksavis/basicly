config:
  default: true
  MD013: false
  MD024:
    siblings_only: true
  MD033: false
  MD041: false
  # MD060 (table-column-style) was disabled for the reason basicly-jaz4 recorded:
  # editing one cell of an ALIGNED table forces a hand re-pad of every other pipe
  # and --fix will not do it. That reasoning is scoped to hand-edited, aligned
  # tables and does not cover generated output, which is what basicly-f0s5j7o
  # found: 62 errors in a consumer's checkout, every one in markdown this
  # repository produced, invisible here because the rule was off. The rule is on
  # again. The three catalog sources and the one generator that failed it are
  # fixed; if an aligned table ever makes jaz4's pain real, normalise the
  # delimiter row in --fix rather than turning this off a second time.
globs:
  - "**/*.md"
ignores:
  - ".venv/**"
  - "node_modules/**"
  # Generated projections are linted too (basicly-gdi): the generator emits
  # lint-clean markdown, so a violation in a projected file means a template
  # or catalog source regressed — fix it there and rebuild.
