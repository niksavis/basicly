# Tier-2 routing evidence for `tool-ast-grep`.
# Prompts paraphrase how a user actually asks; copying the description in would
# game the eval. A failure here means fix the description, not the prompt.
schema_version: 1
trigger:
  positive:
    - prompt: "find every call to this function by its syntax, not by text"
    - prompt: "rewrite this code pattern across the tree structurally"
    - prompt: "text matching is too imprecise for this refactor"
  negative:
    - prompt: "grep the repo for this literal string"
      owner: tool-ripgrep
    - prompt: "batch replace this term in every file"
      owner: tool-sd
