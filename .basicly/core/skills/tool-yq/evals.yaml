# Tier-2 routing evidence for `tool-yq`.
# Prompts paraphrase how a user actually asks; copying the description in would
# game the eval. A failure here means fix the description, not the prompt.
schema_version: 1
trigger:
  positive:
    - prompt: "edit a value in this yaml manifest"
    - prompt: "query the ci config for a field"
    - prompt: "transform this structured settings file"
  negative:
    - prompt: "filter the records in this json response"
      owner: tool-jq
    - prompt: "find which files mention this string"
      owner: tool-ripgrep
