# yaml-language-server: $schema=../../schemas/skill.schema.json
schema_version: 1
name: harness-loop
invocation: model
description: Drive a unit of work through the basicly harness loop end-to-end (intake → classify → decompose → build → verify → ship → teardown → retro) using `basicly loop` + `br`, agent-agnostic across Claude/Codex/Copilot. Use when starting or resuming non-trivial development in a harness-enabled repo, when deciding what phase a tracked issue is in, or when coordinating the checkpoints, gates, and bounded rework the loop enforces.
instructions: |
  # Harness Loop

  ## Scope

  Owns driving tracked work through the whole development loop with the `basicly
  loop` command group over the `br` (beads) tracker — one unit at a time with
  `loop run`, or many lanes at once with `loop preflight` + `loop supervise`. The
  loop is agent-agnostic: the same commands drive it under Claude, Codex, or
  Copilot — the agent supplies the phase inputs (the work type, the child plan) and
  does the coding in the worktree; the engine records state, gates, and advances.

  It is **not** for the mechanics each phase delegates to — those have their own
  skills: `tool-br` (create/claim/close issues), `worktree-isolation` (isolate a
  node's build), `conventional-commits` (format the commit), `tool-git` (staging,
  diffing). This skill sequences them; it does not replace them.

  ## The tracker is the state — start by reading it

  `br` is the single source of truth; the loop keeps no side-state, so it is
  resumable across restarts and across agents. Whatever happened last session, begin
  by reconstructing where a track is:

  ```sh
  basicly loop status <issue>     # phase, worktree binding, gates, checkpoints, rework, ready/blocked
  ```

  Pick the next actionable issue with `br ready` / `br scheduler --json`; `basicly
  loop status` then tells you which phase it is parked in and what it is waiting on.

  ## Tracker state is zero-touch — the engine commits it, you never do

  One tracker, everywhere: a loop-provisioned worktree shares the base
  checkout's `.beads` via br's git-ignored `redirect` file, so `br` commands
  (create, update, comments, gates) work identically from base or any
  worktree and always hit the one real DB/JSONL. There is no worktree tracker
  copy to diverge and nothing to reconcile at landing.

  The engine makes the only tracker commits, at the three natural points:

  1. **At provisioning**, the claim (status, work type, classify approval) is
     committed before the worktree is created, so the claim is in git history
     from the moment work starts — a teammate who pulls sees it immediately.
  2. **At landing**, `loop advance` rolls the `.beads/**` dirt accumulated
     since (checkpoints, gate records) into one `chore(beads)` commit before
     merging. A base that is dirty with anything *outside* `.beads/` still
     blocks — that is someone's uncommitted work.
  3. **At ship**, after `br close`, the engine commits the closing tracker
     state itself.

  So: never `git add .beads` yourself for loop-tracked work, and never commit
  `.beads/issues.jsonl` on a harness branch (restore it if something staged
  it).

  **The base clean-tree check counts untracked files.** Landing mutates the
  shared base checkout, so it runs `git status --porcelain` there with
  untracked paths included — unlike the worktree readiness check, which passes
  `--untracked-files=no` because `git rebase` does not abort on untracked
  files. So a stray untracked file in base blocks the landing exactly like a
  modified tracked one. Check base before every landing:

  ```sh
  git -C <base-checkout> status --short
  ```

  When the dirt is not yours — one shared base checkout with a second
  concurrent session in it is the usual cause — **hold the branch** until that
  session commits its own work, then land. Never `git clean`, `git checkout --`
  or stash another session's files to unblock your merge; the branch waits, the
  other session's work does not survive being cleared.

  **Push cadence** — tracker-only pushes are CI-free by design (`paths-ignore
  .beads/**`; the local commit-msg hooks are the deterministic floor), so the
  choice is purely about who is watching the remote:

  - **Solo repo**: push once per track, after ship — one CI run for the real
    change, none for the tracker noise.
  - **Team repo** (other agents or humans pull the same tracker): push each
    engine tracker commit as soon as it lands — especially the provisioning
    claim commit, so nobody starts work someone already claimed. Cross-machine
    races that still slip through are caught by `br scheduler
    --stale-claim-hours` and `br coordination`.

  ## Advancing the loop — one command per phase boundary

  Drive the loop with `basicly loop run`. It is one command per *boundary*, not per
  step: it advances until it needs an agent or a human, resolving every checkpoint
  it is authorized to resolve on the way. A leaf bead therefore takes two
  invocations, one at each boundary, plus one relay of the confirm code each:

  ```sh
  basicly loop run <issue> --work-type task   # intake -> awaiting the agent's work
  #   ... do the coding in the worktree and COMMIT it on the harness branch ...
  basicly loop run <issue>                    # land, verify, ship, close
  ```

  Without an interactive terminal it stops once per boundary with a one-time
  confirm code and reprints the whole command to re-run — relay the code on *that*
  command, not on a bare `policy checkpoint --approve`, or the checkpoint is
  approved and the loop stays parked. A covering autonomy grant (`basicly policy
  grant`, with `--root <epic>` on the run) resolves the checkpoint with no relay at
  all. Nothing here widens what may be self-approved: a TTY, a covering grant, or a
  relayed code are still the only three ways past a checkpoint.

  ### Answering a confirm-code challenge

  The challenge protects the human **decision**, not the keystrokes. So do not hand
  the command over and wait for someone to type it — that wastes a round trip and
  races the code's 15-minute TTL, and a ship code has expired mid-ask before. The
  protocol is:

  1. **Show the exact command**, including the code.
  2. **Say what approving it does** in one line — which bead, which checkpoint, and
     what happens next. The challenge itself now prints this per checkpoint, so
     read it off the prompt rather than paraphrasing from the phase name: a
     classify approval provisions a worktree, and a ship approval tears the
     worktree down and closes the bead. **Ship does not merge and does not
     publish** — the merge already happened at the build→verify landing, and
     `ship` naming it otherwise is what caused the recorded mis-approval
     (`basicly-jr0l.39`).
  3. **Get an explicit yes.** Silence, "sounds good" about something else, or an
     earlier approval of a different checkpoint is not one. Approval covers the one
     checkpoint in front of you, never the next.
  4. **Then run it yourself.**

  Ask when the challenge appears, not after finishing other work — the code expires
  whether or not you are ready for it. If it has expired, re-run the command with no
  `--confirm` to mint a fresh one and ask again.

  ```sh
  basicly loop advance <issue> [--work-type T] [--children plan.toml] [--mode M]
  ```

  `loop advance` is the single-step form — reach for it to inspect one transition
  in isolation, or when a boundary stopped somewhere you want to step through by
  hand. Both exit non-zero when the track stopped short, so scripts and CI can
  branch on it.

  The flags are the agent-supplied inputs a phase needs; pass the one the current
  phase is asking for (`basicly loop status`/`advance` names it as `needs input`).

  ## Phases and what each one needs

  A reference for what each phase is waiting on — not a checklist to type out.
  `loop run` performs every engine step in this table itself; what it cannot do is
  the agent's own column: propose the work type, write the child plan, do the
  coding, and commit it.

  | Phase | What advances it | Command |
  | --- | --- | --- |
  | **intake** | agent proposes the `br` work type | `basicly loop advance <id> --work-type {bug\|chore\|task\|feature\|epic}` — records the type, then blocks for the classify checkpoint |
  | **classify** *(human checkpoint)* | approve, then the Definition-of-Ready gate must pass | relay the confirm code on the reprinted `basicly loop run <id> --confirm <code>` — `basicly policy checkpoint <id> classify` is **inspection-only** (it prints APPROVED/PENDING; approving there parks the loop). Check readiness with `basicly policy dor <id>`. Never guess which sections the DoR wants — `basicly policy scaffold --type <work-type>` prints the body with every required heading (a `bug` also owes `## Steps to Reproduce`, an `epic` `## Success Criteria`); fill the `TODO`s and pass it to `br create -d` / `br update -d`. The scaffold also emits `## Scope`, which no gate requires and everything downstream reads — **a scope entry is one backticked glob on its own line, `` - `src/basicly/cli.py` ``**. A bare path, or a path with a trailing note, parses to nothing and leaves the bead indistinguishable from one declaring no scope at all; `basicly policy dor <id>` warns when a `## Scope` heading parsed to zero globs |
  | **decompose** | features need an agent child plan; leaves (bug/chore/task) skip straight to build | `basicly decompose <feature> --plan plan.toml` (or `--children` on advance); preview with `basicly decompose <feature> --plan plan.toml --dry-run`. Each child is `{title, acceptance, scope}`; also list in `shared` any literal path from its `scope` the child only *appends its own entry to* (a manifest, a lockfile) — otherwise that one path serializes every child that declares it, and a plan that is honest about its manifests groups worse than one that hides them. The preview names any path that collapsed the grouping, declared or not. A path *no* child declares because the repo's conventions have every lane append to it — a changelog — cannot be handled by that declaration at all; it belongs in `[worktree] append_only_paths`, which serializes the children that would collide on it and makes `loop preflight` warn before a lane starts (`contend:`). Without it the collision is invisible until the merge queue bounces the later lanes, which is a rework retry each |
  | **decompose** *(human checkpoint)* | approve before fan-out | relay the confirm code on the reprinted `basicly loop run <id> --confirm <code>`; `basicly policy checkpoint <id> decompose` is **inspection-only** (approving there parks the loop) |
  | **build** | fan out one worktree per dependency-unblocked child (ranked by `br scheduler`, concurrency-capped), do the work, **commit it on the branch**, then land through the serial merge queue | `basicly worktree list`; do the coding; **`git commit` the work on the harness branch** (referencing the bead — `conventional-commits`); `basicly loop advance <id>` lands it |
  | **verify** | the landing already ran verify and recorded the required gate; inspect it, then approve ship | `basicly policy gate <id>` to inspect, then relay the ship code on the reprinted `basicly loop run <id> --confirm <code>` — not on a bare `basicly policy checkpoint <id> ship --approve`, which approves the checkpoint and leaves the loop parked. Re-run gates (e.g. after rework) with `basicly verify --mode full --issue <id>` — from the base checkout only |
  | **ship** | tear down the worktree and close the issue | `basicly loop advance <id>` (runs teardown + `br close`) |

  > **Never record the verify gate by hand during build.** The build→verify
  > `loop advance` is the *only* step that merges the worktree back to base
  > (`_verify_and_land`); it runs verify and records the gate itself. Recording
  > the gate out-of-band (`basicly verify --issue`, `br gate report verify`)
  > makes the derived phase jump to verify with the merge skipped, and the loop
  > then ships and closes the bead with the code stranded on the harness branch.
  > Let `loop advance` record it; re-run `basicly verify --issue` only *after*
  > the landing has merged (e.g. rework), never before. Ship refuses to close a
  > node whose worktree branch has not landed, as a deterministic backstop.
  >
  > **Commit the build's work on the branch before you advance.** Landing
  > rebases the harness branch, so the agent (or, in manual/handoff mode, you)
  > must `git commit` the changes on the branch first — the loop never
  > auto-commits the agent's work. Leaving the worktree dirty (or the branch
  > with no commit) makes the landing block with "commit the work on
  > `<branch>` before landing"; it no longer misreports it as a rebase
  > conflict or spends a rework attempt on it (basicly-4psl).
  >
  > **A change to the landing-scoring code is scored by the pre-merge version.**
  > `loop run` imports `merge`/`verify`/`loop` from base at process start and
  > never reloads them, so the landing that merges your fix to those modules ran
  > the *old* code. Do not read that verdict as evidence the fix is broken, and
  > do not spend rework retrying it — on basicly-kjc5.56 that burned the whole
  > budget proving nothing. Exercise the new behaviour by calling it from base
  > *after* the merge, then record the gate with
  > `basicly verify --mode full --issue <id>` from base and `loop advance`.

  Leaf types (bug/chore/task) build directly in their own worktree; features
  decompose into children and, once every child closes, land the child worktrees
  that are still live through the merge queue. A child driven through its own
  loop self-lands (its ship phase tears the worktree down), so the parent fan-in
  counts it as already merged instead of failing. See `worktree-isolation` for
  the sibling-worktree placement and provisioning rules the build phase relies
  on.

  ## Gates: deterministic blocks, semantic advises

  Deterministic checks (tests, lint, type, build) report a **required** gate via
  `br gate report --status pass|fail`; a failed required gate blocks advancement.
  AI-semantic verification reports a **non-required** gate — advisory, never
  blocking. Inspect the decision with `basicly policy gate <id>`.

  Gates recorded from a loop-provisioned worktree are safe: its `.beads`
  redirects to the base checkout, so the record lands in the one real tracker.
  `basicly verify --issue` refuses only from a linked worktree *without* that
  redirect (a throwaway tracker copy — the record would be discarded at
  landing). During build you never need to record the gate manually anyway:
  the landing advance verifies the rebased tree in the worktree and records
  the required gate itself.

  ## Re-verify a bead's third-party claims before building on them

  A bead reads as authoritative because it passed the Definition-of-Ready gate, but
  that gate checks structure, not facts: a claim about a third-party API, CLI or
  schema can be wrong when filed and stale by the time the node is dispatched. So in
  build, before implementing against one, measure it against the real endpoint or
  binary, then record the check on the bead (`br comments add <id> "verified: ..."`)
  so the next reader inherits it instead of repeating it.

  `basicly-kjc5.61` asserted that models.dev "decisively" carries a `base_model`
  field joining a provider serving id to the underlying model. Measured against the
  live endpoint: present on **0 of 5911** records, and absent from the record schema
  entirely. Dispatching on that text would have had the implementer build against a
  phantom field and either fail or silently invent a fallback.

  ## A remainder bead is a claim about unfinished work

  A bead filed because a lane hit the context ceiling — "Follow-up: …", "Continues
  `<id>`: its run overran" — records what the *overrun* left, not what the code
  lacks. The parent often finished the work before it stopped, and the remainder was
  written from the lane's last known position rather than from the merged result. So
  treat it exactly like any other third-party claim: **verify it against the code
  before building, and be willing to close it with no diff.**

  Check it clause by clause, and non-vacuously — a function existing is not the same
  as a behaviour reaching a surface. Revert the mechanism you believe already
  delivers each clause and watch named tests fail; if nothing fails, the clause is
  unproven whoever wrote it. Then exercise the real command, because a clause phrased
  as "the output names X" is satisfied by output, not by a helper that could produce
  it. Record the evidence on the bead when closing, so the next reader inherits the
  check instead of re-opening the question.

  Two in consecutive sessions needed no code at all. `basicly-jr0l.53` was already
  delivered by `jr0l.35`; `basicly-jr0l.55` by `jr0l.45`, whose `shared` declaration
  and `collapsing_paths` note covered both its clauses — reverting each failed 3 and
  8 named tests, and a real `decompose --dry-run` showed 3 parallel groups and named
  the path. The error runs both ways, so this is not licence to assume a remainder is
  empty: `basicly-vz78` was closed with its band half wide open.

  ## Blocked on a missing fact — don't guess

  When a dispatched agent cannot resolve a required fact, it must not guess.
  Write `.basicly/usage/needs-input.json` (`{"fact": ..., "detail": ...}`) and
  stop — the loop blocks and surfaces the missing fact instead of landing a
  wrong answer.

  ## Rework and escalation

  A failed node enters a bounded **rework loop (default n=2)**, tracked with gate
  results and comments — not a status change (`br` has no `rework` status). At the
  cap it escalates to a human. Inspect or record attempts with:

  ```sh
  basicly policy rework <id> --gate verify [--record]
  ```

  Any track can escalate a tier (carry work forward, re-hit only the decompose
  checkpoint) without restarting.

  ## Ship and retro

  Ship tears down the worktree and closes the issue. It does **not** merge — the
  merge already happened at the build→verify landing, and ship refuses to close a
  node whose branch has not landed. After an epic slice lands, capture a retro as
  tracker comments and file a `br` issue for each finding the user does not choose
  to ignore:

  ```sh
  br comments add <epic-id> "Retro: <finding>"
  ```

  ## One-shot vs task-by-task

  Default is task-by-task (every checkpoint is a stop). One-shot mode collapses the
  middle (decompose) checkpoint for small, well-scoped work; the classify and ship
  checkpoints still hold.

  ## Many lanes at once — `preflight` first, then `supervise`

  `loop run` drives one bead. The factory's multi-lane path is a different pair of
  commands over an epic, and it is what a parallel run actually uses:

  ```sh
  basicly loop preflight <epic>    # read-only: would a pass start, and what would it cost
  basicly loop supervise <epic>    # provision worktrees, dispatch lanes, land via a serial merge queue
  ```

  **Always run `preflight` first.** It writes nothing and it answers, in one screen,
  every question that otherwise costs a failed pass: whether the base checkout is
  clean, how many worktrees are live, which runner and timeout apply, the active
  grant and its remaining budget, the per-lane assumption for an unsizeable lane, the
  forecast if every lane starts, the band table below, unpushed commits, and a final
  `VERDICT`. Run it **from the base checkout**: `.basicly/usage/` is git-ignored, so a
  worktree sees no run records and the forecast loses its measured prior.

  Two `VERDICT` lines mean "fix this first, the pass will not start": `not ready -
  base checkout is dirty`, and `not ready - a metered runner needs a grant with a
  token budget` (a metered runner needs `basicly policy grant <epic> --level L2/L3
  --token-budget N`).

  ### The band table — four verdicts, one of which refuses

  Every open child is sized and gets exactly one verdict (`supervise.py:_band_verdict`):

  - `in band` — dispatches.
  - `in band, but its scope matched no file` — dispatches, but the scope globs matched
    nothing on disk. Either a broken path or a genuinely greenfield package; the
    estimate is bare overhead either way, so check which before trusting it.
  - `under the floor - dispatches, but merge it with a sibling` — dispatches, carrying
    the band's advice that it is too small to be worth its own lane.
  - `REFUSED - too large, split it` — **the only verdict that refuses.** Only the
    ceiling blocks dispatch; the floor never does.

  **A refusal is a property of the files, not of the change.** The estimate is
  `decompose.scope_read_cost(repo_root, [globs])` over everything the scope matches, so
  a one-line fix in a large module and a rewrite of it are indistinguishable. Never
  argue from the band that a change is large. A `--runner manual` lane still
  provisions the worktree and raises a `needs input: scope` escalation you release
  with `basicly loop answer <decision-id> "<why>"` — answer it with the size of the
  *change* you measured, and say that a manual handoff has no agent context window for
  the ceiling to protect.

  ### Reading a pass

  - `lanes: 0 dispatchable now` counts *adopted* lanes. Before any worktree exists it
    reads zero and that is not a blocker — the supervisor provisions from the ranked
    open children at pass start.
  - The epic's own `decompose` checkpoint must be approved or the pass ends
    `seed-blocked` with no lanes, even when children already exist. A covering grant
    does not serve this by itself: approve it once with `basicly policy checkpoint
    <epic> decompose --approve --root <epic>`.
  - Confirm a landing from the `[merged]` line, never the exit code — `loop run` and
    `supervise` both exit non-zero at any checkpoint, which is not a failure.
  - Every grant, checkpoint and answer writes a tracker marker, which dirties
    `.beads/issues.jsonl` and makes the next landing refuse on a dirty base. Commit it
    between steps.

  ## Resuming after a switch

  Because state lives in `br` (issue status, the worktree binding on
  `external_ref`, recorded gate results, checkpoint/rework comments), resuming — after
  a crash, or when switching from a rate-limited agent to another — is just
  re-reading it: `basicly loop status <issue>`, reconcile against live worktrees
  (`basicly worktree list`), and continue. Start on one agent, finish on another.
