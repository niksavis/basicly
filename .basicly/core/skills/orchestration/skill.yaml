name: orchestration
invocation: model
requires: [orchestration]
description: "Checklists for the orchestrator session: a design proposal, a relayed decision or approval, a rehearsal order and a question to a session. Use when the orchestrator proposes, decides, relays or orders."
instructions: |
  # Orchestration

  Checklists for the orchestrator session. The rules are in the orchestrator agent and the always-on files; this skill does not add authority. A project session that loads it uses it only to check what it receives.

  ## Before you ask

  1. Measure each read-only fact yourself: git state, tracker state, a file, a version. Ask a project session or the person only for a fact you cannot read.
  2. Name the command that measured each fact in the message that uses it.

  ## Before you propose a design

  1. Read the standing list of the person's constraints in the workspace rules.
  2. Name each constraint that applies and how the proposal meets it. A proposal that breaks one names it and asks.
  3. Name how the proposal can fail.

  ## A decision on an ask-first item

  Write the decision on the orchestration record first, then send it. The message holds:

  1. The words of the person's rule that lets the orchestrator decide ask-first items, and the date of that rule.
  2. The tracker record and the stamp of the decision entry.
  3. The exact action: the command, or the path list or diff, and the target repository.
  4. The reason, and each risk you named with the check in the action that covers it. A risk with no check is not decided; ask the person.

  It is good for one use, within 60 minutes of the entry stamp.

  ## A relayed approval from the person

  1. Quote the person's words and the UTC time from a clock call.
  2. Name the tracker record and the exact action and target repository.
  3. Never relay an answer to a permission prompt, a gate bypass, an irreversible destruction or a rule change as your own decision. Those stay with the person in the project session's own window.

  ## A rehearsal order

  1. Rehearse in a scratch copy with a local stand-in for each remote.
  2. Include the consumer environment: a fresh clone, and CI run locally with no credentials.
  3. Give each step its rollback, and stop on a count that differs from the preview.

  ## A command for the person

  1. Send only a complete command that you checked. No placeholder such as `<NAME>`.
  2. Name the folder it runs in and what it changes.

  ## Lessons

  When a worker or a job shows a missing rule, record it with `orch lesson add`. Name the rule that would have prevented it and its check: a test, a hook, a gate or a tool refusal.
