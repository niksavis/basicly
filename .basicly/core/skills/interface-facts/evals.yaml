# Tier-2 routing evidence for `interface-facts` (docs/design/catalog-efficacy-design.md §6).
# Prompts paraphrase how a user actually asks; copying the description in would
# game the eval. A failure here means fix the description, not the prompt.
schema_version: 1
trigger:
  positive:
    - prompt: "check the vendor's current documentation before I hard-code this"
    - prompt: "what flags does that third-party cli actually accept today"
    - prompt: "confirm the price and limit rather than recalling them"
  negative:
    - prompt: "send a raw post body and inspect the headers"
      owner: tool-curl
    - prompt: "resume this download if the connection drops"
      owner: tool-wget
