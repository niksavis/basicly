# Tier-2 routing evidence for `tool-wget`.
# Prompts paraphrase how a user actually asks; copying the description in would
# game the eval. A failure here means fix the description, not the prompt.
schema_version: 1
trigger:
  positive:
    - prompt: "download this archive and retry if it drops"
    - prompt: "fetch a file non-interactively from a script"
    - prompt: "mirror this directory of files"
  negative:
    - prompt: "inspect the headers this endpoint returns"
      owner: tool-curl
    - prompt: "call the rest api and read the body back"
      owner: tool-xh
