# yaml-language-server: $schema=../../schemas/skill.schema.json
schema_version: 1
token_cost:
  listing: 52
name: decompose-plan
invocation: model
description: "Splits an epic or feature into child tasks a build can check: EARS criteria, scope, dependencies and a demonstration command. Use to split work into tasks, or when the plan gate refuses a child."
covers:
  phases: [decompose]
instructions: |
  # Decompose a plan the gate accepts

  Cut one unit into children that each do something a consumer can see. The plan gate refuses an incomplete child before any build starts.

  ## Rules

  - **Slice vertically.** Each child changes something a consumer can see, so verify has something to check. A schema-only or tests-only child is a horizontal cut.
  - **Give every child a runnable demonstration** in backticks, on one line.
  - **Scope the file that produces the value**, not the file that shows it, and name the child's own file, never a directory glob. [Scoping](references/scoping.md) shows how to find the producer.
  - **Flatten, never nest.** A child that needs children was cut wrong.

  ## Steps

  1. Find the producer of each value the work changes, as [scoping](references/scoping.md) shows.
  2. Write `plan.toml`:

     ```toml
     [[children]]
     title = "Refuse a flag with no expiry"
     acceptance = ["When basicly flag add runs without --expires, the command shall exit 2 and name the flag."]
     scope = ["src/basicly/flags.py", "tests/test_flags.py", "changelog.d/EPIC.1.added.md"]
     depends_on = []
     demonstration = "`basicly flag add beta --owner me` exits 2 and prints the missing --expires"
     ```

  3. Preview, read each path the dry run says collapsed the grouping, then create:

     ```sh
     basicly decompose FEATURE --plan plan.toml --dry-run
     basicly decompose FEATURE --plan plan.toml
     ```

  ## The plan fields

  | Field | Refused when | Notes |
  | --- | --- | --- |
  | `title` | absent | Sibling titles are the names `depends_on` uses. |
  | `acceptance` | absent | Write each criterion in EARS form (trigger, state, condition, optional feature, ubiquitous), so a check can be derived from it. |
  | `scope` | absent | Two children that write one path serialize. |
  | `depends_on` | absent, or cyclic | An empty list is a declaration; an absent key is not. A cycle is refused with its members before any record is created. |
  | `demonstration` | absent, no backticked runnable span, or spread over several lines | A command, a request or a test through the consumer surface. |
  | `shared` | optional | Paths from `scope` that each child only appends its own entry to, such as a lockfile. |
  | `budget_tokens`, `integrity` | present but invalid | Optional. Omit them when the user sets no limit. |
