# Tier-2 routing evidence for `tool-typos` (docs/design/catalog-efficacy-design.md §6).
# Prompts paraphrase how a user actually asks; copying the description in would
# game the eval. A failure here means fix the description, not the prompt.
schema_version: 1
trigger:
  positive:
    - prompt: "proofread these docs for misspellings"
    - prompt: "catch spelling mistakes in the comments"
    - prompt: "check the readme for misspelled words"
  negative:
    - prompt: "check this shell script for quoting bugs"
      owner: tool-shellcheck
    - prompt: "find every occurrence of this literal string"
      owner: tool-ripgrep
