# Tier-2 routing evidence for `node` (docs/design/catalog-efficacy-design.md §6).
# Prompts paraphrase how a user actually asks; copying the description in would
# game the eval. A failure here means fix the description, not the prompt.
schema_version: 1
trigger:
  positive:
    - prompt: "npx resolves the wrong binary inside my git hook"
    - prompt: "install the npm packages this repo needs"
    - prompt: "the markdownlint hook fails from a background job"
  negative:
    - prompt: "sync the python environment for this project"
      owner: tool-uv
    - prompt: "mount access under /mnt/c is painfully slow"
      owner: wsl
