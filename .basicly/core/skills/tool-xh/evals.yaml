# Tier-2 routing evidence for `tool-xh` (docs/design/catalog-efficacy-design.md §6).
# Prompts paraphrase how a user actually asks; copying the description in would
# game the eval. A failure here means fix the description, not the prompt.
schema_version: 1
trigger:
  positive:
    - prompt: "hit this rest endpoint and read the response"
    - prompt: "test the api with clean defaults"
    - prompt: "make a quick http call without a wall of flags"
  negative:
    - prompt: "debug the redirect at the protocol level"
      owner: tool-curl
    - prompt: "mirror the release archive to disk"
      owner: tool-wget
