name: work-tracker
invocation: model
description: "Reads, files, claims and closes records in the ledger tracker. Use to plan work, check what is ready, file a bug, or claim an issue before work starts."
instructions: |
  # Work Tracker

  The tracker is an append-only event log in `.basicly/ledger/`, committed with the code. A record is the fold of its events.

  ## Steps

  ```sh
  python3 .basicly/core/kit/tracker/cli.py ready .basicly/ledger
  python3 .basicly/core/kit/tracker/cli.py create .basicly/ledger --title "Title" --field issue_type=task
  python3 .basicly/core/kit/tracker/cli.py claim .basicly/ledger RECORD-ID
  python3 .basicly/core/kit/tracker/cli.py close .basicly/ledger RECORD-ID --reason "why"
  ```

  1. **Find or file the record before the work.** Run `create` alone and read the id from its reply; the id is random, and the `tracker-commit-msg` hook refuses a commit that names an id the ledger does not hold.
  2. **Claim it before the first edit,** then push, because others see a claim only after they pull.
  3. **Commit the code with the id in the subject**, and stage `.basicly/ledger` with it: the hooks read the Git index.
  4. **Close it** with a reason once the whole task is done.

  When `basicly` is on PATH, `basicly tracker write -- VERB ...` runs the same writes through the engine.

  ## Rules

  - **Never take a record that someone holds.** `ready` names each holder; `--take` is for an agreed handover only. The holder is `--to`, else `git config basicly.holder`, else `git config user.name`; set `basicly.holder` to a pseudonym.
  - **Name a record by its title, with the id as the address.** A person cannot read a bare id.
  - **Never edit, delete or reorder a line in an event file.** Append the write that supersedes the wrong one.
  - **Probe against a scratch ledger directory, never the live one.** The log has no undo.
  - **Check the output shape before you parse it.** `show` on an absent record prints `{"found": false}`; `create` prints `created: RECORD-ID` unless the argv carries `--json`.
  - **Use one ledger per repository, never one per worktree.** The git-ignored `.basicly/ledger/redirect` points every worktree at the same log.

  ## Read when needed

  - For selective reads, history or the served page, read [read](references/read.md).
  - Before a write, review or close, read [write](references/write.md) for the grammar and the Context, Acceptance and evidence contracts.
  - For imports, shard folding or bulk queries, read [maintenance](references/maintenance.md).
