# Tier anchors — the reviewed input to `.scripts/generate_model_map.py`.
#
# A catalog source declares a *model tier* (schema.MODEL_TIERS), never a provider
# model id: the same model is spelled `claude-haiku-4-5` by Anthropic and
# `claude-haiku-4.5` by GitHub Copilot, so a pinned id is portable to exactly one
# surface. This file names one anchor model per (tier, vendor); the generator
# resolves each anchor to every listed surface's own spelling, cost and limits and
# writes `model-map.json`.
#
# Edit this file to move a tier to a different model, then re-run the generator
# and review the resulting `model-map.json` diff. Everything else in the map is
# derived from models.dev and must not be hand-edited.
schema_version: 2

# Where a resolved model can be written. Each key is a models.dev provider id.
surfaces:
  anthropic:
    consumed_by: Claude Code agent frontmatter and the Anthropic API
    accepts: hyphenated Anthropic model id
    verified: Claude Code frontmatter takes this id or a short alias such as `haiku`
  openai:
    consumed_by: the OpenAI API
    accepts: models.dev serving id for this provider
    verified: not exercised here — models.dev's published serving id, taken on trust
  moonshotai:
    consumed_by: the Moonshot API
    accepts: models.dev serving id for this provider
    verified: not exercised here — models.dev's published serving id, taken on trust
  google:
    consumed_by: the Gemini API
    accepts: models.dev serving id for this provider
    verified: not exercised here — models.dev's published serving id, taken on trust
  github-copilot:
    consumed_by: GitHub Copilot and VS Code custom-agent frontmatter
    accepts: dotted models.dev serving id (the display name is a second accepted alias)
    verified: >-
      exercised against copilot CLI 1.0.75 — the dotted id and the display name are
      both accepted and the hyphenated Anthropic form is rejected

# The general-model rule every anchor must satisfy, so a sweep cannot pick an
# image, TTS, embedding, realtime or video model as a tier. Measured against the
# live payload 2026-07-31: it excludes 21 of Google's 41 records and 10 of
# OpenAI's 47, and all 16 anchors below pass it. `reasoning` is recorded per
# anchor but deliberately not required — requiring it would exclude general
# tool-calling models such as gpt-4o and gemini-2.0-flash.
general_model_rule:
  require_text_input: true
  require_text_only_output: true
  require_tool_call: true

# One anchor per (tier, vendor). Every vendor must declare all four tiers.
#
# `collapse` states, in the data, that two tiers resolve to the same model on
# purpose. Only Anthropic publishes a genuine fourth class (Fable); the other
# three vendors ship a three-class ladder, so high and maximum land on the same
# top class — which is what agent-roster-design R5 already says. The generator
# cross-checks that a collapsed tier really does name the same model as its
# target, so the declaration cannot drift from the ids.
vendors:
  - id: anthropic
    name: Anthropic
    # The vendor's own provider first, then any broker that resells it.
    surfaces: [anthropic, github-copilot]
    tiers:
      low: claude-haiku-4-5
      medium: claude-sonnet-5
      high: claude-opus-5
      maximum: claude-fable-5

  - id: openai
    name: OpenAI
    surfaces: [openai, github-copilot]
    tiers:
      low: gpt-5.6-luna
      medium: gpt-5.6-terra
      high: gpt-5.6-sol
      maximum: gpt-5.6-sol
    collapse:
      maximum: high
    collapse_reason: >-
      OpenAI ships a three-class ladder, so high and maximum resolve to its top
      class. The `-pro` models are deliberately not used for maximum: measured
      2026-07-31, github-copilot serves none of the six (gpt-5-pro, gpt-5.2-pro,
      gpt-5.4-pro, gpt-5.5-pro, o1-pro, o3-pro), so the tier would be unusable on
      one of the two surfaces this repo requires.

  - id: moonshotai
    name: Moonshot AI
    surfaces: [moonshotai, github-copilot]
    tiers:
      low: kimi-k2.5
      medium: kimi-k2.7-code
      high: kimi-k3
      maximum: kimi-k3
    collapse:
      maximum: high
    collapse_reason: >-
      Moonshot ships a three-class ladder, so high and maximum resolve to Kimi K3.
      This note previously read that github-copilot serves exactly one Moonshot
      model and that three of the four tiers resolve to unavailable there. Stale
      as of the 2026-08-09 refresh: copilot now serves kimi-k3, so only `low`
      (Kimi K2.5) is unavailable on that surface. The point the note was making
      still stands — an unserved tier resolves to unavailable rather than being
      quietly substituted with a neighbouring tier's model.

  - id: google
    name: Google
    surfaces: [google, github-copilot]
    tiers:
      low: gemini-3.1-flash-lite
      medium: gemini-3.6-flash
      high: gemini-3.1-pro-preview
      maximum: gemini-3.1-pro-preview
    collapse:
      maximum: high
    collapse_reason: >-
      Google ships a three-class ladder, so high and maximum resolve to its top
      Pro class. That top id is a `-preview`: previews get renamed or withdrawn at
      GA, so this pin is the least stable in the map. It is pinned rather than
      guessed at, and `--check` fails naming the id the moment it stops resolving
      — there is deliberately no silent fallback to an older Pro.
