target-version = "py314"
line-length = 100
indent-width = 4

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "D",   # pydocstyle
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "C90", # mccabe (cyclomatic complexity, see [lint.mccabe])
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PL",  # Pylint
    "RUF", # Ruff-specific rules
]
ignore = [
    "D100",   # Missing docstring in public module
    "D104",   # Missing docstring in public package
    "D203",   # 1 blank line required before class docstring
    "D213",   # Multi-line docstring summary should start at the second line
    "PLR2004", # Magic value used in comparison (common in tests and small scripts)
]

# Cyclomatic complexity (basicly-u2hl.5). 15, because that is what binds today at zero
# cost: measured on 2026-08-07, this tree has 0 violations at 15 and 14 at 10. So the gate
# lands green and immediately refuses the next function that crosses, rather than arriving
# with 14 failures and an argument about whether to turn it off.
#
# It is meant to be ratcheted down as the 14 are paid off, and there is a trap in how:
# extracting `_part1()`/`_part2()` satisfies C901 and makes the code worse. Extract along a
# nameable responsibility or leave it — the `python-guidelines` skill owns that judgment,
# because no linter can make it.
[lint.mccabe]
max-complexity = 15

[lint.pydocstyle]
convention = "google"

[format]
preview = true
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
