repos:
- repo: local
  hooks:
  - id: markdownlint
    name: markdownlint
    # Repo-wide run through .markdownlint-cli2.yaml (globs + generated-file
    # ignores) instead of staged filenames, so explicit paths can't bypass the
    # config's ignore list.
    #
    # Launched through a script that resolves node itself rather than `npx
    # --no-install markdownlint-cli2` (basicly-jr0l.14): a hook shell has no
    # profile, so with nvm off PATH WSL interop resolved npx to the Windows
    # nodejs, which cannot express the worktree's UNC path. The launcher never
    # invokes npx and fails in one line when no usable node exists.
    entry: uv run python .basicly/core/hooks/markdownlint.py
    language: system
    stages:
    - pre-commit
    pass_filenames: false
    files: \.md$
- repo: local
  hooks:
  - id: identity-guard
    name: identity-guard
    entry: uv run python .basicly/core/hooks/identity-guard.py
    language: system
    stages:
    - pre-commit
    pass_filenames: false
    always_run: true
  - id: pre-commit-script
    name: pre-commit-script
    entry: uv run python .basicly/core/hooks/pre-commit.py
    language: system
    stages:
    - pre-commit
    pass_filenames: false
    always_run: true
  - id: catalog-lint
    name: catalog-lint
    entry: uv run python .basicly/core/hooks/catalog-lint.py
    language: system
    stages:
    - pre-commit
    pass_filenames: false
    always_run: true
  - id: secret-scan
    name: secret-scan
    entry: uv run python .basicly/core/hooks/secret-scan.py
    language: system
    stages:
    - pre-commit
    pass_filenames: false
    always_run: true
  - id: tracker-path-scan
    name: tracker-path-scan
    entry: uv run python .basicly/core/hooks/tracker-path-scan.py
    language: system
    stages:
    - pre-commit
    pass_filenames: false
    always_run: true
  - id: internal-info-scan
    name: internal-info-scan
    entry: uv run python .basicly/core/hooks/internal-info-scan.py
    language: system
    stages:
    - pre-commit
    pass_filenames: false
    always_run: true
  - id: kit-boundary
    name: kit-boundary
    entry: uv run python .basicly/core/hooks/kit-boundary.py
    language: system
    stages:
    - pre-commit
    pass_filenames: false
    always_run: true
  - id: commit-msg-script
    name: commit-msg-script
    entry: uv run python .basicly/core/hooks/commit-msg.py
    language: system
    stages:
    - commit-msg
    pass_filenames: true
  - id: tracker-commit-msg-script
    name: tracker-commit-msg-script
    entry: uv run python .basicly/core/hooks/tracker-commit-msg.py
    language: system
    stages:
    - commit-msg
    pass_filenames: true
  - id: pre-push-script
    name: pre-push-script
    entry: uv run python .basicly/core/hooks/pre-push.py
    language: system
    stages:
    - pre-push
    pass_filenames: false
    always_run: true
  - id: protect-generated-commit
    name: protect-generated-commit
    entry: uv run python .basicly/core/hooks/protect-generated-commit.py
    language: system
    stages:
    - pre-commit
    pass_filenames: false
    always_run: true
