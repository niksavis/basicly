# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: quality-gates

# Tracker-only pushes skip CI: the harness loop necessarily commits tracker state
# separately from the work (basicly-flp), and the local commit-msg hooks are the
# deterministic floor for those commits.
"on":
  push:
    branches: [main]
    paths-ignore:
      - ".basicly/ledger/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - ".basicly/ledger/**"
  workflow_dispatch:
    inputs:
      base:
        description: Full ancestor commit SHA for bounded manual validation
        required: false
        type: string
      all_history:
        description: Explicitly audit all commits reachable from this revision
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  commit-messages:
    name: Commit messages (conventional + beads id)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: Validate conventional commit messages
        shell: bash
        env:
          BASICLY_CI_EVENT: ${{ github.event_name }}
          BASICLY_CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          BASICLY_CI_BASE: ${{ github.event.pull_request.base.sha || inputs.base }}
          BASICLY_CI_BEFORE: ${{ github.event.before }}
          BASICLY_CI_ALL_HISTORY: ${{ inputs.all_history }}
        run: |
          range="$(uv run python .basicly/core/hooks/commit-range.py)"
          echo "Checking commit messages in range: ${range}"

          commits_file="$(mktemp)"
          git log --format='%H' "$range" > "$commits_file"
          failed=0
          count=0
          while IFS= read -r commit_sha; do
            if [ -z "${commit_sha}" ]; then
              continue
            fi

            count=$((count + 1))
            subject="$(git log -1 --format='%s' "${commit_sha}")"
            # Validate the FULL message (subject + body), matching the local
            # commit-msg hooks: the beads issue id is a trailing body line by
            # convention (and dotted child ids can't live in the subject), so a
            # subject-only check would spuriously fail it.
            msg_file="$(mktemp)"
            git log -1 --format='%B' "${commit_sha}" > "${msg_file}"

            if ! uv run python .basicly/core/hooks/commit-msg.py "${msg_file}"; then
              echo "Invalid commit message in ${commit_sha}: ${subject}" >&2
              failed=1
            fi

            if ! uv run python .basicly/core/hooks/tracker-commit-msg.py "${msg_file}"; then
              echo "Missing/unknown beads issue id in ${commit_sha}: ${subject}" >&2
              failed=1
            fi

            rm -f "${msg_file}"
          done < "$commits_file"
          rm -f "$commits_file"

          if [ "${count}" -eq 0 ]; then
            echo "No commits to validate."
          fi

          exit "${failed}"

  quality-gates:
    name: Quality gates on ${{ matrix.os }}
    needs: commit-messages
    # ubuntu runs this in ~3 minutes, so 30 is headroom rather than a
    # budget. It exists because a job with no timeout runs to the runner's 6-hour limit,
    # and GitHub serves no log for a job until its whole run finishes: windows-latest sat
    # at 5h57m on every push for two days, and the ubuntu failure underneath it was
    # unreadable the entire time. A slow job must fail while somebody is still looking
    # (basicly-t31pvf).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Python dependencies
        run: uv sync
      - name: Prepare pinned Lefthook runtime
        run: |
          python3 src/basicly/lefthook_artifacts.py --download
          uv run python -c "from pathlib import Path; from basicly.lefthook_binary import sync_binary; sync_binary(Path.cwd())"
      - name: Install Node dependencies
        run: npm install --no-fund --no-audit
      # No external tracker is installed (basicly-vkh0.42.2). The cost is stated rather
      # than hidden: the real-git/real-tracker integration suites are `skipif`-gated on
      # the binary being on PATH, so they skip here and run only on a developer machine
      # until the harness reads its own store (basicly-vkh0.29).
      - name: Lint markdown
        run: npx --no-install markdownlint-cli2
      - name: Lint catalog sources
        run: uv run python -m basicly.cli catalog lint
      # Only the full (pre-push) gate runs: it is a superset of the fast
      # (pre-commit) checks — ruff, format, pyright, bandit — plus pytest, so
      # running pre-commit too just repeated that work (basicly-5uo6).
      - name: Run full checks (ruff, format, pyright, bandit, pytest)
        run: uv run python .basicly/core/hooks/pre-push.py
