# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: release

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    name: Release quality gates
    if: |
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Python dependencies
        run: uv sync
      - name: Prepare pinned Lefthook runtime
        run: |
          python3 src/basicly/lefthook_artifacts.py --download
          uv run python -c "from pathlib import Path; from basicly.lefthook_binary import sync_binary; sync_binary(Path.cwd())"
      - name: Install Node dependencies
        run: npm install --no-fund --no-audit
      - name: Lint markdown
        run: npx --no-install markdownlint-cli2
      - name: Lint catalog sources
        run: uv run python -m basicly.cli catalog lint
      # The test suite is not run here: CI runs it on main for the same release commit,
      # and a release must fit in ten minutes (basicly-8xwfe5a). The fast checks stay.
      - name: Run pre-commit checks
        run: uv run python .basicly/core/hooks/pre-commit.py

  smoke-install:
    name: Fresh-repo install smoke test
    if: |
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install locked markdownlint prerequisites
        run: npm ci --no-fund --no-audit
      - name: Prepare pinned Lefthook artifacts
        run: python3 src/basicly/lefthook_artifacts.py --download
      - name: Build the distribution to exercise
        run: uv build
      - name: Install the prepared wheel into a fresh repo then check and uninstall
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          wheel="${GITHUB_WORKSPACE}/dist/basicly-${tag#v}-py3-none-any.whl"
          mkdir smoke
          cp -R node_modules smoke/node_modules
          cd smoke
          git init -q
          git config user.email ci@example.invalid
          git config user.name ci
          uvx --from "$wheel" basicly install
          uvx --from "$wheel" basicly check
          uvx --from "$wheel" basicly hooks-check
          uvx --from "$wheel" basicly uninstall

  release:
    name: Publish GitHub release
    needs: [verify, smoke-install]
    if: |
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve tag name
        id: resolve_tag
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            tag_name="${GITHUB_REF_NAME}"
          fi
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"

      - name: Ensure tag is available locally
        shell: bash
        run: |
          tag_name='${{ steps.resolve_tag.outputs.tag_name }}'
          git fetch --force --tags origin
          git rev-parse "${tag_name}" >/dev/null

      - name: Verify tag matches package version
        shell: bash
        run: |
          tag_name='${{ steps.resolve_tag.outputs.tag_name }}'
          pkg_version="$(python3 -c "
          import re, pathlib
          text = pathlib.Path('src/basicly/__init__.py').read_text()
          print(re.search(r'__version__ = \"([^\"]+)\"', text).group(1))
          ")"
          if [ "v${pkg_version}" != "${tag_name}" ]; then
            echo "Tag ${tag_name} does not match package version ${pkg_version};" \
              "bump src/basicly/__init__.py before tagging" >&2
            exit 1
          fi

      - name: Generate release notes from changelog
        shell: bash
        run: |
          tag_name='${{ steps.resolve_tag.outputs.tag_name }}'

          # The page is the summary, the changelog is the record (basicly-xsdvp6): the
          # author's prose above the first category heading, the entry counts, a link to
          # the section at the tag, every BREAKING entry, and the pinned install line
          # (basicly-vwlm). Nothing else - v0.10.0 published the whole 2,326-line section.
          # Stdlib only, so it runs on the runner's python3 before uv is set up.
          python3 .scripts/generate_release_notes.py \
            --tag "${tag_name}" \
            --repo-url "https://github.com/${GITHUB_REPOSITORY}" > release-notes.md

      - uses: astral-sh/setup-uv@v7

      - name: Prepare pinned Lefthook artifacts
        run: python3 src/basicly/lefthook_artifacts.py --download

      - name: Build distribution artifacts
        run: uv build

      - name: Bundle the standalone tracker into one file
        shell: bash
        run: |
          uvx --from ./packages/basicly-tracker basicly-tracker bundle --out dist/tracker.pyz
          python3 dist/tracker.pyz --help >/dev/null

      - name: Prepare stable installer assets from this release
        run: |
          cp .scripts/bootstrap.sh dist/install.sh
          cp .scripts/bootstrap.ps1 dist/install.ps1

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.resolve_tag.outputs.tag_name }}
          name: ${{ steps.resolve_tag.outputs.tag_name }}
          body_path: release-notes.md
          # Upload only the real build artifacts; a bare dist/* also sweeps up
          # the 1-byte scratch .gitignore uv writes into the output dir.
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/tracker.pyz
            dist/install.sh
            dist/install.ps1
