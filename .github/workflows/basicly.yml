name: basicly

# Tracker-only pushes skip CI: the harness loop necessarily commits tracker state
# separately from the work (basicly-flp), and the local commit-msg hooks are the
# deterministic floor for those commits.
on:
  push:
    branches: [main]
    paths-ignore:
      - ".basicly/ledger/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - ".basicly/ledger/**"

jobs:
  check:
    name: Projection drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: PYTHONPATH=src uv run python -m basicly.cli check
