[project]
name = "basicly-tracker"
version = "0.2.0"
description = "An append-only work tracker whose ledger merges cleanly under parallel work"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
basicly-tracker = "basicly_tracker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["basicly_tracker"]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.hatch.build.targets.wheel.force-include]
"../../.basicly/core/kit/tracker" = "basicly_tracker/kit"
"../kit_installer.py" = "basicly_tracker/installer.py"
