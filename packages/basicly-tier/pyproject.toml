[project]
name = "basicly-tier"
version = "0.2.0"
description = "Resolve a declared model tier into the model a host will actually spawn"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
basicly-tier = "basicly_tier:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["basicly_tier"]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.hatch.build.targets.wheel.force-include]
"../../.basicly/core/kit/tier" = "basicly_tier/kit"
"../kit_installer.py" = "basicly_tier/installer.py"
"../../.basicly/core/models/model-map.json" = "basicly_tier/kit/model-map.json"
