[project]
name = "basicly-comments"
version = "0.2.0"
description = "Refuse prose comments in code files, and remove them when asked"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
basicly-comments = "basicly_comments:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["basicly_comments"]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.hatch.build.targets.wheel.force-include]
"../../.basicly/core/kit/comments" = "basicly_comments/kit"
"../kit_installer.py" = "basicly_comments/installer.py"
