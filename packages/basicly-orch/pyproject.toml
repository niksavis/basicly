[project]
name = "basicly-orch"
version = "0.1.0"
description = "Orchestrator tools: herdr session state from vendor hooks, and the lessons log"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
orch-state-hook = "orch_state.reporter:main"
orch = "orch_lessons.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orch_state", "orch_lessons"]
exclude = ["**/__pycache__", "**/*.pyc"]
