[project]
name = "basicly-orch"
version = "0.1.0"
description = "Report coding agent session state to herdr from vendor hooks"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
orch-state-hook = "orch_state.reporter:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orch_state"]
exclude = ["**/__pycache__", "**/*.pyc"]
