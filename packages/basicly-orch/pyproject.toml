[project]
name = "basicly-orch"
dynamic = ["version"]
description = "Orchestrator tools: herdr session state from vendor hooks, and the lessons log"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
orch-state-hook = "orch_state.reporter:main"
orch = "orch_lessons.cli:main"
orch-guard-hook = "orch_guard.hook:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "../../src/basicly/__init__.py"

[tool.hatch.build.targets.wheel]
bypass-selection = true
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.hatch.build.targets.wheel.force-include]
"../../.basicly/core/kit/orch/runner.py" = "runner.py"
"../../.basicly/core/kit/orch/orch_state" = "orch_state"
"../../.basicly/core/kit/orch/orch_lessons" = "orch_lessons"
"../../.basicly/core/kit/orch/orch_guard" = "orch_guard"
"../../.basicly/core/kit/orch/orch_relay" = "orch_relay"
