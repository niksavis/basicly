[project]
name = "basicly-board"
version = "0.1.0"
description = "Serve a tracker ledger as a web page and an HTTP API on localhost"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
basicly-board = "basicly_board:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["basicly_board"]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.hatch.build.targets.wheel.force-include]
"../../.basicly/core/kit/board" = "basicly_board/kit"
"../../.basicly/core/kit/tracker" = "basicly_board/tracker"
"../kit_installer.py" = "basicly_board/installer.py"
