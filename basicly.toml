[paths]
# Managed core fragments shipped by basicly.
core_fragments = ".basicly/core/fragments"

# User-owned overlay fragment roots. These are never modified by `basicly install`.
overlay_fragments = [".basicly-local/fragments"]

# Engine assets and output manifest.
targets = ".basicly/core/targets"
templates = ".basicly/core/templates"
manifest = ".basicly/generated-manifest.json"

# Technology scoping (architecture §9): this repo's stack. Untagged catalog
# sources are universal and always ship; a technologies-tagged source ships only
# when its tag is listed here. basicly is a Python + Node repo (the CLI and the
# markdownlint hook), so it selects python and node; the wsl skill is authored
# but not selected here, staying available to repos that opt in.
[catalog]
technologies = ["python", "node"]

# The Tier-2 routing floor (basicly-m4zv.2). `basicly catalog lint` ranks every
# entry's positive eval prompts against
# the whole model-invoked description corpus with stemmed TF-IDF and reports the
# share whose owner ranked *first*; below this floor the gate fails.
#
# Owner decision 2026-08-07, against a measured baseline of 80/87 = 92.0%. One
# positive losing rank 1 costs 1/87 = 1.15 points, so 0.85 (needs >= 74/87)
# absorbs 6 regressions: CI reddens on a trend rather than on a single
# description edit. 0.90 was rejected because one miss of slack against the
# near-tied tool-skill pairs would redden CI on unrelated edits and train people
# to lower the floor; 0.80 was rejected because the 10 regressions it absorbs
# exceed the 7 positives that already reach top-k without reaching rank 1, so
# every current near-tie could regress and the gate would still pass.
#
# `rank1_floor_high_water` is the ratchet, and the two start equal on purpose.
# The lint refuses a floor below the high-water mark, so raising the floor is a
# one-line edit while lowering it has to lower the record too — which turns a
# change that reads like maintenance into a diff that states what it is.
# Lowering a floor is the same act as deleting the test: fix the description the
# eval is failing on instead.
rank1_floor = 0.85
rank1_floor_high_water = 0.85

# Which step of the work-tracker cutover this repo is on (basicly-vkh0.19,
# docs/requirements/work-tracker.md §5). Three values, and each is a rung:
#
#   external  br is the only store. The pre-cutover behaviour, and what a consumer
#             who has never installed the kit's tracker gets.
#   dual      Every write the engine makes through the br seam is recorded on the
#             owned event log under `.basicly/ledger/` as well. br stays
#             authoritative for every read. A write the ledger cannot record fails
#             the command — the two stores are only worth running side by side
#             while they hold the same facts.
#   owned     The flip. `br.read_record` — the one record-read seam — answers out of
#             the ledger; br is *still written*, because the other ten subcommands
#             the engine spawns still read out of it.
#
# **This repo is on `external`, and the rung above it is not a config edit.** Step 1
# of §5 is the import, and it ran on 2026-08-07: `.basicly/ledger/events-0001.jsonl`
# holds 3775 events over 643 records, every one carrying the export's digest. Step 2
# is the shadow differential, and the command is `basicly tracker shadow` — it reads
# the owned ledger against the **live** br, writes to neither, and answers `clean`
# and `conclusive` as two separate verdicts. Live and not a re-import, because an
# import cannot express a deletion and two derivatives of one lossy snapshot agree
# with each other and prove nothing (§5.1). What is left: `dual`, then a run that comes
# back clean **and** conclusive, then `owned`. The first run (2026-08-07) is conclusive
# and **not** clean: 331 of 643 compared records carry a passing `verify` gate row on the
# live tracker and none on the ledger, because no export carries a gate field for the
# import to have read — so only the dual write can close that gap.
[tracker]
mode = "external"

# Sibling git-worktree isolation for harness tracks.
[worktree]
# Branch new harness/<name> worktrees fork from. Empty = the current branch.
base_branch = ""
# Cap on how many worktrees may exist at once.
concurrency = 5
# Paths this repo's own conventions have every lane append its own entry to, and
# which therefore appear in no bead's `## Scope` (basicly-o8p0). Declaring one here
# makes `decompose` serialize the children that would collide on it and makes
# `loop preflight` warn before a lane starts, instead of the merge queue bouncing
# the later lanes at a rework retry each.
#
# **Empty on purpose, and do not put `CHANGELOG.md` back.** It was the whole list,
# and serializing every lane was the cost of detecting a collision the repo's own
# landing convention created. `basicly-4746` removed the cause instead: a lane writes
# `changelog.d/<bead-id>.<category>.md` and `basicly release` assembles the fragments,
# so no two lanes share a changelog file and there is nothing left to serialize. The
# list stays for a path a future convention genuinely shares — the mechanism is not
# wrong, the changelog just no longer needs it.
append_only_paths = []
# Artifacts every lane rebuilds and no bead declares (basicly-lyro). The projection
# manifest is a pure function of the tree, so two lanes editing different catalog
# sources both rewrite it and the second one's landing rebase conflicts on an artifact
# with no semantic disagreement in it. Measured: three lanes editing three different
# skills — `basicly-l7zo`, `basicly-5xcj`, `basicly-sco6` — landed two and burned both
# of the third's rework attempts here.
#
# Deliberately not in `append_only_paths`: that list makes lanes serialize, which is
# the right answer for prose nobody can auto-merge and the wrong one here. Nothing
# needs serializing — the file just needs rebuilding once on the merged tree.
generated_paths = [".basicly/generated-manifest.json"]
regenerate_command = ["basicly", "build"]

# Deterministic verify gate. Each check runs in the listed modes; a "staged"
# check with staged_suffix runs only against staged files of that suffix. A check
# whose repair is purely mechanical also declares fix_command: the pre-commit
# hook applies it to the staged files (and `basicly verify --fix` before the
# checks), so the check never reports a failure a script could have fixed.
[[verify.checks]]
name = "ruff"
command = ["ruff", "check"]
modes = ["fast", "full", "staged"]
staged_suffix = ".py"

[[verify.checks]]
name = "ruff-format"
command = ["ruff", "format", "--check"]
fix_command = ["ruff", "format"]
modes = ["fast", "full", "staged"]
staged_suffix = ".py"

[[verify.checks]]
name = "pyright"
command = ["pyright"]
modes = ["fast", "staged"]
staged_suffix = ".py"

# Cross-platform type resolution (basicly-kjc5.55). pyright resolves per platform
# and ignores skipif markers, so a POSIX-only name (os.getpgid, signal.SIGKILL)
# type-checks clean on Linux and fails only on the Windows CI runner — which is
# how basicly-kjc5.54 shipped. The host-only `pyright` above stays for fast
# feedback; `full` checks every supported platform explicitly so the defect is
# caught before the push instead of by CI. One run each, ~3s per non-host
# platform. There is no single-invocation form: `--pythonplatform All` is not a
# valid value (pyright exits 4).
[[verify.checks]]
name = "pyright-linux"
command = ["pyright", "--pythonplatform", "Linux"]
modes = ["full"]

[[verify.checks]]
name = "pyright-darwin"
command = ["pyright", "--pythonplatform", "Darwin"]
modes = ["full"]

[[verify.checks]]
name = "pyright-windows"
command = ["pyright", "--pythonplatform", "Windows"]
modes = ["full"]

# Security scan of the Python this repo executes outside its own package (basicly-5gn2).
# `.basicly/core/kit` was added by basicly-wbsz.1 and inherited no coverage: the targets
# were written when `.scripts` and the hooks were the whole set, and nothing failed when a
# third directory appeared — the kit ships to consumers via `basicly install` and runs in
# an agent spawn path, so it is the least acceptable one to miss. The targets are a list
# a human maintains, so `tests/test_verify.py::test_bandit_scans_every_harness_python_directory`
# fails when the next directory is added without being named here.
[[verify.checks]]
name = "bandit"
command = [
  "bandit",
  "-q",
  "-c",
  "pyproject.toml",
  "-r",
  ".scripts",
  ".basicly/core/hooks",
  ".basicly/core/kit",
]
modes = ["fast", "full"]

# Dead code (basicly-uexy). `vulture` was declared at pyproject.toml:37 and called
# from nowhere — not by a check, not by a script — so the dependency that finds
# instruments nobody connected was itself an instrument nobody connected. That is the
# whole shape Phase S exists to remove, and it is this gate's own first finding.
#
# Scoped to `src` and `.scripts`, and the omission of `tests` is the point rather than
# an oversight: with the tests out of scope, a name whose only reader is a test reads
# as unused, which is exactly the rule — a reference from a test is not a consumer.
# Suppressions live in `[tool.vulture] ignore_names` (pyproject.toml), vulture's only
# mechanism, and `wired-or-deleted` below fails on any entry that stops reproducing.
#
# 60 is vulture's default confidence, kept rather than raised: the tiers above it
# report only unreachable code, and every real finding on this tree — a record field
# written and never read, a helper only a test calls — sits at 60.
[[verify.checks]]
name = "vulture"
command = ["vulture", "--min-confidence", "60", "src", ".scripts"]
modes = ["fast", "full"]

# Wired-or-deleted (basicly-uexy): nothing merges with references only inside its own
# module and under `tests/`. Covers the three surfaces vulture cannot see — a CLI
# subcommand no hook, check, workflow or catalog instruction invokes (`permissions-check`
# shipped exactly that way), a `config.py` key nothing reads, and a record field read
# only by the module that declares it — and polices vulture's suppression list, which
# vulture itself never re-checks.
#
# A repo-local script rather than a CLI subcommand pair, on the same grounds as
# `docs-claims`: the wiring gated here is basicly's own, so there is nothing to
# project. No `fix_command`, because the repair is a deletion or a call site, and
# neither is mechanical. `uv run python` per basicly-tcmy.32.
#
# In `fast` as well as `full` despite spawning vulture a second time: measured 0.90s
# (0.92/0.89/0.90 over three runs, of which vulture itself is 0.27s) against seconds
# for pyright and pytest, so the cost is noise beside a merged instrument nobody
# connected. Re-measure if a fifth surface is added; do not scale the number.
[[verify.checks]]
name = "wired-or-deleted"
command = ["uv", "run", "python", ".scripts/wired_or_deleted.py"]
modes = ["fast", "full"]

# The one-way kit boundary (basicly-vkh0.16). `docs/requirements/work-tracker.md` §4 named
# `lint-imports` below as the enforcement for it. That was not a gap in the wiring, it
# was unenforceable: import-linter analyses one `root_package`, declared as `basicly`,
# and the kit is flat modules under `.basicly/core/kit` with no `__init__.py` and not
# on `sys.path`, so the tool never opens a kit file. It would have reported `kept`
# forever — the same fail-open shape the contract two entries down was rewritten to
# escape. `tests/test_kit_boundary.py::test_import_linter_cannot_see_a_kit_violation`
# runs both gates on one seeded violation and records the disagreement.
#
# `full` only, and that is not a downgrade: the same script is wired at `pre-commit`
# in `.basicly/core/hooks/hooks.yaml`, so commit time is covered by the hook and CI by
# this entry (quality-gates runs `pre-push.py`, i.e. mode `full`). Declaring it in
# `fast` as well would run it twice on every commit for nothing. The hook is also the
# wiring that reaches consumers, whose basicly.toml is their own.
#
# `uv run python`, per the rule `test_no_verify_check_invokes_a_bare_python_interpreter`
# holds: a bare `python` on windows-latest is a system interpreter.
[[verify.checks]]
name = "kit-boundary"
command = ["uv", "run", "python", ".basicly/core/hooks/kit-boundary.py"]
modes = ["full"]

# The kit's two deployment requirements (basicly-vkh0.21). `events.py` needs
# `events-*.jsonl` declared `-text` or a normalising checkout rewrites a log whose ids
# are content-derived; `snapshot.py` needs the ledger's ignore rules to cover
# `DERIVED_PATTERNS` or a fold of the log gets committed beside it. Each was stated in a
# docstring and nowhere else, which is the same shape as `kit-boundary` above: a closed
# bead proves the code exists, not that anything enforces what it asks for.
#
# `fast` as well as `full`, unlike `kit-boundary` — that entry is `full` only because a
# pre-commit hook already covers commit time, and this has no hook. The two questions it
# asks git are `check-attr` and `check-ignore` on five sample paths, so commit-time cost
# is noise beside a requirement that only bites once a ledger is live.
#
# `uv run python`, per `test_no_verify_check_invokes_a_bare_python_interpreter`.
[[verify.checks]]
name = "kit-deployment"
command = ["uv", "run", "python", ".scripts/kit_deployment.py"]
modes = ["fast", "full"]

[[verify.checks]]
name = "lint-imports"
# Enforces the import-linter contracts in `.importlinter`: the engine's tier stack
# and the renderers' sub-stack. Both are `exhaustive`, so a new module has to be
# placed in a tier rather than sliding in unconstrained. Whole-tree analysis, so no
# staged variant.
#
# Until basicly-tcmy.2 this was a single `forbidden` contract naming
# `basicly.fragments` and `basicly.targets` — modules that did not exist and could
# not exist, since fragments and targets are YAML under `.basicly/core/`. It
# reported `1 kept, 0 broken` over 48 files forever, in this repo and in every
# consumer repo, which is this repo's own named defect class: a fail-open gate is
# indistinguishable from a pass. `tests/test_import_contracts.py` is the control
# pair that keeps the replacement falsifiable.
#
# `uv run`, not a bare `lint-imports` (basicly-ihg3). This is the only configured check that
# resolves its target by *import* rather than by path — pyright and vulture read files under
# cwd — so a bare spelling follows the inherited venv instead of the checkout being verified.
# A landing runs verify as a subprocess of `basicly loop advance`, launched with `uv run` from
# the base checkout, so PATH carried the base `.venv/bin` and import-linter analysed the base
# package: every lane adding a new module failed with `module basicly.<new> does not exist`,
# a finding no amount of bounded rework could act on.
command = ["uv", "run", "lint-imports"]
modes = ["fast", "full"]

[[verify.checks]]
name = "pytest"
# pytest-xdist parallelizes the subprocess-heavy CLI tests; this is the bulk of
# the gate's wall time. Capped rather than `-n auto`, and the reason is lane
# concurrency, not a lock: this gate runs *inside every lane*, so a supervised
# pass multiplies it by `[loop] concurrency`. Keep `concurrency x workers` at or
# under the core count — at concurrency 5 that is 4 workers on a 16-32 core box,
# where `auto` would ask for 5x32.
#
# The previous justification here — a machine-global br write lock at
# ~/.beads/.write.lock whose 30s timeout `auto` stampeded (basicly-9s59) — is
# STALE and was removed rather than left to mislead. Measured 2026-08-01 on br
# 0.2.16, 32 cores: `-n auto` ran 2119 passed in 17.5s with zero lock failures,
# and again in 19.3s while 1297 concurrent external `br init` operations were
# driven against the same machine. ~/.beads/ does not exist. See basicly-m4zv.14
# for the full probe. Re-measure before trusting either number on another host.
command = ["pytest", "-q", "-n", "4"]
modes = ["full"]

# The five projection gates, run locally (basicly-m4zv.11). They were CI-only,
# which left exactly the hole the positioning claims we do not have.
# `protect-generated-commit` catches a hand-*edited* generated file by comparing
# the staged blob against the manifest, but it cannot see a *stale* projection:
# editing a fragment does not stage the generated output at all, so its on-disk
# bytes still match. A fragment edit with no rebuild therefore passed every local
# hook and reached the remote stale.
#
# In "fast" (every commit) rather than "full" alone, because that is what makes the
# commit-time claim in README/site/About true. Measured at ~1.05s for all five
# together (1.09/1.04/1.08 over three runs) against seconds for pyright and pytest,
# and most of that is `uv run` spawn overhead (~0.18s each) rather than work — so
# the cost is noise. Re-measure when a sixth pair is added; do not scale the number.
#
# `projection-permissions` was missing from this list until basicly-tcmy.23, so a
# `.basicly/core/permissions/permissions.yaml` edit shipped an unbuilt deny-list
# with every documented gate green — the same hole the other four closed, one pair
# later. `tests/test_verify.py` now derives the required set from the CLI's own
# handler registry, so a sixth pair cannot be omitted by hand the same way.
[[verify.checks]]
name = "projection-check"
command = ["basicly", "check"]
modes = ["fast", "full"]

[[verify.checks]]
name = "projection-skills"
command = ["basicly", "skills-check", "--all-default-roots"]
modes = ["fast", "full"]

[[verify.checks]]
name = "projection-agents"
command = ["basicly", "agents-check"]
modes = ["fast", "full"]

[[verify.checks]]
name = "projection-hooks"
command = ["basicly", "hooks-check"]
modes = ["fast", "full"]

[[verify.checks]]
name = "projection-permissions"
command = ["basicly", "permissions-check"]
modes = ["fast", "full"]

# Derivable documentation claims (basicly-tcmy.31). A document that restates a fact
# the tree already answers — the measured always-on character counts, the set of
# shipped subcommands, the catalog inventories — drifts the moment the tree moves and
# nothing notices; that is the shape tcmy.9 and tcmy.26 both found. So the derivable
# content is generated into marked blocks and gated here instead of hand maintained.
#
# A repo-local script rather than a CLI subcommand pair: the claims are basicly's own
# documentation, not a consumer artifact, so there is nothing to project. `--fix` is
# the mechanical repair, so the pre-commit fast set regenerates and re-stages a stale
# block exactly as it does for ruff format.
#
# `uv run python`, not a bare `python` (basicly-tcmy.32). The bare-binary convention of
# every other check holds for *console scripts* — ruff, pyright, bandit, pytest,
# basicly — which the venv installs into its bin/Scripts directory. It does not hold
# for the *interpreter*: on windows-latest a bare `python` resolves to a system
# interpreter with neither `yaml` nor `basicly` importable, so the script died at
# import time and this check alone failed the Windows quality-gates job while passing
# on ubuntu and macos. `uv run python` is the form every other repo script invocation
# already uses (quality-gates.yml, release.yml).
# `tests/test_verify.py::test_no_verify_check_invokes_a_bare_python_interpreter` holds
# the rule for the next check, and fails on POSIX too rather than waiting for CI.
[[verify.checks]]
name = "docs-claims"
command = ["uv", "run", "python", ".scripts/docs_claims.py", "--check"]
fix_command = ["uv", "run", "python", ".scripts/docs_claims.py", "--fix"]
modes = ["fast", "full"]

# Module size, as a token ratchet (basicly-u2hl.5). No ruff rule measures module length, so
# nothing in this stack noticed `cli.py` reaching 53,095 tokens — the owner's stated pain,
# and invisible to every green gate. The cap is `decompose.SCOPE_FILE_READ_CAP`, imported
# rather than respelled, so the size a lane is refused at is the size the sizing governor
# budgets with. `[tool.module_size]` in pyproject.toml holds the ratchet: the 78 modules
# already over the cap, each at its go-live count, plus the waiver count.
#
# A repo-local script rather than a CLI subcommand pair, on the same grounds as `docs-claims`
# and `wired-or-deleted`: the debt being ratcheted is basicly's own, and a consumer's cap
# would be its own decision with its own frozen list. `uv run python`, not a bare `python`,
# per the note above this file's `docs-claims` entry.
#
# No `fix_command`. Splitting a module is the repair and it is a judgment — extracting
# `_part1()`/`_part2()` satisfies a size gate and makes the code worse — so there is nothing
# mechanical to apply. Reading 179 files is the whole cost, which is why it is `fast` too.
[[verify.checks]]
name = "module-size"
command = ["uv", "run", "python", ".scripts/check_module_size.py"]
modes = ["fast", "full"]

# Prose density, as a per-module ratchet (basicly-wxr3). The tree measured 39.4% prose —
# comments plus docstrings, in the same token unit `module-size` uses — with recent commits
# adding comments at 35.5% of added code lines against 10.5% mid-history. Nothing bound:
# `ERA001` catches only commented-out code, and no rule in the stack reads a comment.
#
# It is a ratchet rather than the purge hook the request started as, and the reason is a
# measurement: `convention = "google"` makes docstrings mandatory (D101/D102/D103/D105), so
# stripping `#` comments relocates narration into a docstring the linter demands, and 64
# comments in this tree are pragmas the lint gates read. A purge would break those gates
# and hand every frozen `module-size` entry a 12-36% free shrink.
#
# No `fix_command`. Which sentence is narration and which is the measurement behind a
# threshold is the judgment `python-guidelines` owns, and no tool can make it.
[[verify.checks]]
name = "comment-density"
command = ["uv", "run", "python", ".scripts/check_comment_density.py"]
modes = ["fast", "full"]

# Suppression debt, as a per-code ratchet (basicly-u2hl.12). ruff cannot police its own
# suppressions — a `# noqa` is the one edit that makes the linter agree with you — so the
# count lives outside the code, in `[tool.noqa_debt]` in pyproject.toml. §9.1 recorded 46;
# it was 76 by the time the gate was built, every one added through a green gate.
#
# A repo-local script rather than a CLI subcommand, on the same grounds as `module-size`:
# the debt is basicly's own and a consumer's frozen table would be its own decision.
# `uv run python`, not a bare `python`, per the note above this file's `docs-claims` entry.
#
# No `fix_command`. The mechanical repair — raise the number — is the one thing that must
# not be automatic, because a reviewer reading that line is the entire mechanism.
[[verify.checks]]
name = "noqa-debt"
command = ["uv", "run", "python", ".scripts/check_noqa_debt.py"]
modes = ["fast", "full"]

# One test file per source module, enforced by name (basicly-u2hl.14,
# `docs/requirements/factory-loop.md` §9.4). The convention was *emergent* when the
# requirements doc measured it — 48 modules, 84 test files, every module covered — and
# nothing made it binding, so the first splits broke it: after `dad39f4`, ten source units
# had no test file named after them and nine of those were created that day. Their tests
# were not missing, they stayed in the file named after the module they were extracted
# from, which is the drift the gate exists to stop.
#
# Forward direction only: a source unit must have a test file, a test file need not have a
# source unit. `tests/` legitimately covers `.scripts`, the git hooks, the shipped kit and
# whole-loop integration paths, none of which are modules — failing on those would make the
# gate unrunnable rather than stricter.
#
# A repo-local script rather than a CLI subcommand pair, on the same grounds as
# `module-size` and `docs-claims`: the convention is basicly's own, and a consumer's test
# layout is its own decision. `uv run python`, not a bare `python`, per the note above this
# file's `docs-claims` entry.
#
# No `fix_command`. The repair is deciding which tests belong to the new module and moving
# them, which is a judgment — a script that created an empty `test_<module>.py` would
# satisfy the gate and prove nothing, which is the vacuous-instrument shape this repo keeps
# paying for. In `fast` as well as `full`: it reads no file contents, only two `git
# ls-files` listings, so the cost is one subprocess.
[[verify.checks]]
name = "test-naming"
command = ["uv", "run", "python", ".scripts/check_test_naming.py"]
modes = ["fast", "full"]

# Loop gate/checkpoint policy: which gates block advancement and the rework cap.
[policy]
# Gate names (from [verify] / br gate report) that MUST pass to advance. Any
# recorded gate not listed here is advisory (never blocks).
required_gates = ["verify"]
# Rework retries allowed before a node escalates to a human.
max_rework = 2
# BUILD's second entry predicate (requirements 3.1): how many units may stand
# downstream of build unlanded — merged and parked in verify, or verified and
# waiting on a ship checkpoint — before a further dispatch is refused.
#
# Five, which is `[worktree] concurrency`, and the two agreeing is a coincidence
# worth stating rather than a derivation: concurrency bounds how many lanes run
# at once, this bounds how much finished-but-unreviewed output exists, and a
# pass can exhaust the second while well inside the first. At these values one
# full-width pass is admitted and a second cohort waits until the first lands,
# which is the behaviour this repo already had — lower it to make review, not
# slots or tokens, the constraint that binds.
max_downstream_wip = 5

# Agent-agnostic runner: how the harness invokes a coding agent headless to do a
# node's work in its worktree. "auto" detects claude -> codex -> copilot on PATH,
# else falls back to the "manual" handoff (no command is guessed for an unknown
# agent). Add or override an agent with [[runner.agents]]; verify any command
# with `basicly runner dry-run` before a live run.
[runner]
# Agent-agnostic detection (claude -> codex -> copilot on PATH), so a supervised
# run dispatches without a session override and a consumer inherits a working
# default rather than the handoff. Interactive driving is the case this costs:
# `loop run`/`loop advance` take no `--runner`, so the handoff can only be
# restored from config (basicly-nvm1).
default = "auto"
# Backstop, no longer the working bound (basicly-lpsf). At 1800 this was a bound
# calibrated *inside* the upper tail of real work — the longest successful lane
# measured 1712s against it, 95.1%, and 10 of 68 successes finished past 80% — so
# it killed lanes that were working. It was there because it was the only terminal
# signal there was, and it is the one signal that says nothing about whether work
# is happening.
#
# `quiet_after` below and the spend ceiling now bind first, and both read the
# dispatch's own event stream (basicly-rupz), so they can tell a working lane from
# a wedged one. Restored to the 3600 default it had been lowered from, which leaves
# it for what neither of those can see: a process that hangs holding the pipe, or a
# stream that stops while the process does not exit.
#
# Not a licence to run long. The forward cost gates (basicly-vz78) and the spend
# bound are what bound a runaway now, and both are denominated in tokens rather
# than seconds. Raising this alone would have been the trap this bead was filed to
# avoid: it moves the cliff one tail-length out and weakens the only runaway bound
# in the process.
#
# The kill costs the run nothing either way: the harness commits whatever the
# worktree holds on the way out and the landing judges that diff, because a clock
# is not evidence against a change (basicly-yvx9).
runner_timeout = 3600
# Terminal quiet bound: seconds of a *silent* event stream before a lane is killed
# as wedged. Left at the engine default (1800s), stated here because it is the
# bound that replaced the wall clock and a reader of this file should see all three
# together — `stall_after` flags at 900s, this kills at 1800s, `runner_timeout`
# backstops at 3600s.
#
# Uncalibrated, and there is no honest way to calibrate it yet: no inter-event gap
# has ever been measured, because until basicly-rupz the stream was requested, paid
# for and discarded. What bounds it from below is the longest single tool call a
# lane here makes with the stream silent, and the largest one this repo has is its
# own test suite at 76s (`uv run pytest -q`, 2552 passed, measured 2026-08-06).
# 1800 is 23x that. Tighten it once the passes this ships with have recorded what
# the real gaps are.
quiet_after = 1800
# The model tier every dispatch of this repo resolves through (basicly-tcmy.35).
# The tier vocabulary (basicly-kjc5.58), the committed map (basicly-kjc5.61) and
# the pre-spawn refusal (basicly-kjc5.59) all shipped here, and this repo declared
# no tier — so the refusal was unreachable, because it fires only when a tier *was*
# declared, and every lane ran on whatever the agent CLI happened to default to
# that day. What that cost is on the record: 48 metered claude dispatches carrying
# an exact 313.30 USD of spend between them, not one of which names the model that
# spent it, and 36 of them naming two different observed models for a single run.
#
# `high` is not a new choice. `high` x anthropic x anthropic resolves to
# `claude-opus-5` in `.basicly/core/models/model-map.json`, and `claude-opus-5` is
# the model every one of those 36 records observed — so this declaration pins what
# the ledger already recorded rather than moving the work onto a different model.
# What changes is that a dispatch's record now names the tier, where it came from
# (`family default tier`) and whether it was honoured, which is what
# `basicly-7bur`'s cost-per-landed-package and `basicly-u6jq.1`'s proof run need
# before their numbers are about anything.
#
# A family default rather than a per-agent `[[runner.agents]] tier`, because the
# claim is about this repo's work and not about one CLI: an agent that needs
# another tier declares its own and keeps `agent tier` as its provenance.
#
# `config.untiered_metered_runners` is this declaration's falsifier, gated by
# `tests/test_config.py`: delete this line and a metered dispatch is back to an
# unnamed model, and the check fails naming the key rather than the symptom.
# `basicly runner dry-run <prompt>` prints the tier and the resolved model id, so
# a change here is checkable before a live run.
default_tier = "high"

# The context window each agent's model actually has, in tokens (basicly-23ep).
# The denominator for the [policy.sizing] context_ceiling meter, and the one
# number in that calculation that describes a *capability of the runtime* rather
# than a choice this repo made — so it is declared here, beside the model it
# describes, instead of inherited from a per-adapter default nobody re-checks.
#
# The default it replaces was 200000, correct when written and stale since. This
# repo's own ledger refutes it: seven dispatches carry a measured `context_tokens`
# and two of them (basicly-tcmy.5 at 223221, basicly-gczc at 210721) sit ABOVE
# 200000, which cannot happen. The consequence was not a near miss — at the 0.6
# ceiling the finalize protocol fired at 120000, so six healthy lanes were
# truncated and each spun a `(context-ceiling overrun)` follow-up bead for work
# that was never over any real limit.
#
# 1000000 is the window of Claude Opus 5, which is the model this repo dispatches:
# every one of those seven records observed `claude-opus-5` — read off
# `observed_models` rather than assumed, since nothing pinned a model when they
# ran. Checked against the vendor's live model documentation on 2026-08-04 — not
# recalled, per the rule that made the previous figure wrong. The committed model
# map corroborates it independently: `.basicly/core/models/model-map.json` already
# records `claude-opus-5` at a 1000000-token context.
#
# That map is also the follow-on neither bead takes. It carries a per-model
# `limit_tokens.context`, so a runner that pins a *tier* could resolve its window
# from the map instead of declaring one — the window would then follow the model
# automatically and could not go stale again. When this was written that was
# unreachable, because the runner pinned nothing and the model was only knowable
# after the dispatch, from what the CLI reported it ran; `[runner] default_tier`
# above (basicly-tcmy.35) is what makes it reachable, and the tier declared there
# resolves to the same `claude-opus-5` whose map entry carries this exact figure.
# Wiring that lookup is engine work rather than a declaration, so the window stays
# declared here until it is done.
#
# `tests/test_runner.py::test_no_recorded_occupancy_exceeds_its_runners_declared_window`
# is the gate that keeps this honest: it fails, naming both figures, the first time
# a lane records an occupancy this declaration says is impossible. Had it existed,
# it would have caught the 200000 the first time a lane recorded 210721.
[runner.context_windows]
claude = 1_000_000
