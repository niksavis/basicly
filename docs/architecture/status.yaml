# The one source for the capability status view (architecture D-30).
#
# `docs/architecture/status.md` renders this file into its `status-view` generated block,
# and `.scripts/docs_claims.py` gates that rendering on every commit. Edit a row here and
# run `uv run python .scripts/docs_claims.py --fix`; editing the rendered table instead
# fails the gate.
#
# A row changes state in the change that lands the behaviour, never in a later cleanup
# pass. `status` must be one of the six words the architecture document's own component-state
# table defines: the renderer reads that table rather than holding a second copy of it, so a
# seventh word is refused here rather than reviewed.
#
# `note` carries the evidence the state requires, flattened to one line when rendered, so a
# long note may wrap freely.
sections:
- name: Guidance
  capabilities:
  - name: 'One catalog projected to three agent families: instructions, skills, subagents,
      permissions'
    status: shipped
    note: ''
  - name: Projection drift gate run by CI
    status: shipped
    note: ''
  - name: Path-scoped rules tier
    status: shipped
    note: Engine built; four fragments and one skill glob use it. Cost falls for two families
      and rises for the one that inlines
  - name: Invocation axis per entry
    status: shipped
    note: Declared on skill sources; not yet on fragments
  - name: Deterministic lexical routing evals with a ratcheting rank-1 floor
    status: shipped
    note: ''
  - name: Both skill roots written by every skills command
    status: shipped
    record: basicly-jt0dgi
    note: 'A bare `skills-build` or `skills-check` covers every default root, and the check
      names them. `--root` still narrows to one; `--all-default-roots` is a deprecated no-op'
  - name: An eval case file per catalog entry, enforced as a structural failure
    status: building
    record: basicly-m4zv.3
    note: Model-invoked skills carry one by convention; fragments carry none
  - name: Relieve the always-on baseline by scoping what is conditional
    status: building
    record: basicly-a3ab
    note: Authoring work, not engine work
  - name: Tutorial and how-to layer
    status: shipped
    note: The tutorial was executed end to end on a fresh repository before it was written
  - name: Whether an individual entry changes behaviour, and which baseline rules bind while
      an agent works
    status: researching
    record: basicly-kjc5.46
    note: Recall is measured; adherence is open. **The largest gap in the system**
  - name: Behavioural efficacy evals with control arms, hidden checks and a safety tier
    status: designed
    record: basicly-imnu.13
    note: No arms, no hidden checks, no safety tier exist in code
  - name: Cursor as a target; a native Codex scoped-rules renderer
    status: deferred
    note: For Codex there is currently no mechanism to project *to*
- name: Gates
  capabilities:
  - name: Git hook floor across three stages
    status: shipped
    note: ''
  - name: Agent hooks for two families
    status: shipped
    note: 'Four hooks: three on claude spanning two event types, one on copilot'
  - name: Verify pipeline with three modes
    status: shipped
    note: ''
  - name: 'Ratchets: module size, comment density, suppression debt, corpus drift, stale citations'
    status: shipped
    note: Tree growth reports rather than blocks, because it has no firing history
  - name: Severity required on judged output, and a lint refusing a pre-judging reviewer bundle
    status: shipped
    note: ''
  - name: Rework convergence detection from the open-finding set rather than the count
    status: shipped
    note: ''
  - name: A release gate refusing to ship a declared capability nothing has exercised
    status: shipped
    note: Derives the inventory from the configured checks, and fails closed with no ledger
      at all
  - name: A gate that runs the demonstration a unit declared
    status: shipped
    note: '`demonstration_proof` runs it: advisory at the decompose advance, **blocking at
      the ship advance**. It rebuilds a pytest argv from an allowlist; a non-pytest demonstration
      is still admitted'
  - name: The plan gate running the demonstration it admits
    status: deferred
    note: 'Not `designed`: this is a deliberate separation, not sequenced work. The plan gate
      judges the field''s form and `demonstration_proof` runs the command, at the decompose
      advance and at the ship advance. Architecture §36.4 holds the reason. No open work item
      proposes moving the run into the gate [measured 2026-08-16, a `plan[_ ]gate` search
      over every tracker record: 12 open matches, none of them proposing it, against a positive
      control of 11 closed matches]'
  - name: Every gate classified by type
    status: building
    record: basicly-dho6cc
    note: The gates the engine names by constant are typed; the rest are classified in prose
      because they have nothing to key on
  - name: Enforcement at the tool-call boundary, not only at the commit boundary
    status: designed
    record: basicly-q9aa4q
    note: 'Engine work before it is catalog work: the host event vocabulary is barely mapped'
  - name: '`basicly install` reporting the capability tier it actually delivered'
    status: building
    record: basicly-imnu.3
    note: On a host with no plugin tier the projection degrades to advice, and we say so nowhere
  - name: A check that code citations of `architecture §N` resolve
    status: shipped
    note: '`.scripts/check_code_citations.py`, `code-citations` in `basicly verify`: 377 citations in 101 modules, 161 resolve to a heading, 216 unresolved and frozen so the count may only fall'
  - name: 'A typed event vocabulary: `note` for prose, first-class kinds for machine state'
    status: partial
    record: basicly-vkh0.39
    note: '**Ten of the eighteen kinds exist and one of the three new ones now has a reader.**
      `artifact` is the live transport for a handoff artifact: `tracker.read_artifacts` folds
      it and `artifact_record.recorded` consumes it, over 10 events on this ledger [measured
      2026-08-21]. `note` carries prose and only the kit''s own writer records it, so the log
      holds none; `checkpoint` has no writer at all and folds into named state that only
      `snapshot.record_to_dict` reads. `comment` is a permanent alias of `note` — 2,821 of
      6,273 events — and the write seam still emits it, so a marker body is still parsed as
      prose rather than selected by kind. The target set is **eighteen** kinds, sized by partitioning the measured population
      rather than by proposal — routing 2,540 `comment` rows through the thirteen first drafted
      left 585 of them, 23%, with nowhere to go. Architecture §32.3 carries the vocabulary,
      §32.3.1 the measured partition and its command, §32.3.2 the reader''s alias, §32.8 the
      migration, and D-34 the decision including why `record` is unavailable'
  - name: A single definition of the closed event-kind set
    status: shipped
    note: '`events.KNOWN_KINDS` is an explicit twelve-member frozenset and every sibling takes
      its kind from it — the ten built kinds of the eighteen, plus `comment` as the permanent
      alias and `edge_retracted` beside `edge` [measured 2026-08-21]. It was **six** partial
      definitions, not the four first recorded —
      `baseline.py` and `provenance.py` were missed. `baseline.py` keeps its own spelling
      deliberately, with the reason at the declaration. Two tests bind it, one over this repository''s
      own log and one over every sibling''s AST, both proven against five mutations. Architecture
      §32.8'
  - name: A `unknown_kinds` signal that separates delegation from corruption
    status: shipped
    note: '`classify_kind` answers applied, delegated or unknown, `DELEGATED_KINDS` names
      the folding function per kind, and `fsck` warns only on the third case — moving 1,015
      events, 18.09% of the log, out of the false-unknown population. The closed set is checked
      to be exactly applied plus delegated, and disjoint. Architecture §32.8'
  - name: The owned tracker as the only store
    status: shipped
    note: 'The external binary is removed: no `br.py`, every write goes through the engine
      seam into `.basicly/ledger/`, and `ledger-fsck` gates the log on every commit.
      Architecture §32'
  - name: A mermaid render check on every committed block
    status: shipped
    note: '`.scripts/check_mermaid.py` renders every block through `render_mermaid.mjs`
      (mermaid pinned) and runs as the `mermaid` verify check'
- name: The loop
  capabilities:
  - name: Single-track loop driven identically by any supported agent
    status: shipped
    note: ''
  - name: Worktree isolation per unit of work
    status: shipped
    note: ''
  - name: 'Parallel lanes: supervisor, lane mini-loop, serial landing'
    status: shipped
    note: ''
  - name: Autonomy grants with a spend ceiling, decision queue, confined decider
    status: shipped
    note: 'Two of the five decision kinds are delegable: `needs-input` and `escalation`'
  - name: Release automation up to the annotated tag
    status: shipped
    note: ''
  - name: Scope sized by the material a lane actually reads
    status: shipped
    note: ''
  - name: Measured context occupancy recorded beside the forecast on every dispatch
    status: shipped
    note: ''
  - name: VALIDATE as a rung with its own gate, a validator plus a reviewer per lens
    status: shipped
    note: ''
  - name: Hold and Kill as writes an operator's answer actually carries out
    status: shipped
    note: ''
  - name: A named role per judgment step
    status: shipped
    note: All seven reachable; **the declared tier is inert at spawn**, and no supervised
      pass has yet recorded a role on an argv
  - name: RETROSPECTIVE on a computed special cause
    status: shipped
    note: ''
  - name: An improvement controller driving a codebase property to a set point
    status: shipped
    note: Has run live and filed one issue; manual-dispatch caller only, by decision
  - name: A schema-validated handoff artifact at each state boundary
    status: building
    record: basicly-mmmrqd
    note: Three of eight kinds have a producer, two of those a consumer. The rest refuse
      nothing, and four of those - `classification`, `change-shape`, `verification-evidence`
      and `validation-transcript` - are tracked by no work item. Architecture §33 carries the
      per-kind measurement
  - name: Tier injection, so a declared tier reaches the spawn
    status: building
    record: basicly-a3yi
    note: '**The break is at projection, not at spawn** [measured 2026-09-16]. The catalog source
      declares the tier - `.basicly/core/agents/reviewer/agent.yaml` reads `tier: high` - and
      **0 of 11 projected files under `.claude/agents/` carry a `tier:` field**. `agents.py`
      parses the tier into the agent model and validates it against `MODEL_TIERS`, and nothing
      emits it into the rendered frontmatter, so the resolver reads a file the tier never
      reached. The hook is now installed here and correctly rewrites nothing. Two earlier
      clauses are withdrawn as false - the claude installer exits 0 and writes the
      `PreToolUse`/`Agent` entry, and the hook returns `hookSpecificOutput.updatedInput`, which
      is a documented field rather than a contract the host refuses. Whether the host calls the
      hook on a real spawn is still unproven; every probe fed the script a payload directly. On
      copilot the installer writes nothing and its stated reason is known-wrong - that host now
      ships hooks and carries per-subagent selection in config, which basicly-u2hl.41 wires'

  - name: Per-model spend and wall-clock forecast enforced at pass admission
    status: building
    record: basicly-u6jq.3
    note: The current forecast models working set, not turn count, and that is now measured
      rather than suspected
  - name: A supervised multi-lane run with zero human interventions caused by an engine defect
    status: building
    record: basicly-zq9i2m
    note: ''
  - name: 'The judged-output contract: a reviewer structurally incapable of seeing the producer''s
      conclusion, a review base recorded before dispatch, re-review scoped to the fix range,
      late rounds escalating a tier'
    status: designed
    record: basicly-a4q3.11
    note: '**Deterministic engine code, not a persona**, which is why it survived the routing
      landing'
  - name: Cost per landed unit
    status: researching
    record: basicly-884gj4
    note: The instrument the tier claims rest on
- name: The board
  capabilities:
  - name: A published snapshot contract a foreign harness can conform to
    status: shipped
    note: '`.basicly/core/schemas/board-snapshot.schema.json`, deliberately not strict, so a
      consumer meeting an undeclared key counts and reports it rather than erroring. Carries
      no figure it cannot re-derive'
  - name: A file-only producer that folds the log once and spawns nothing
    status: shipped
    note: 'Four modules — bounds, row reducers, `.basicly/usage/` sections, assembly — with
      the fold count and the subprocess count both pinned by spies, because "reads only files"
      is a claim one convenient import breaks'
  - name: Omit-never-estimate, so an absent source is absent rather than zero
    status: shipped
    note: The schema has no field marking a value as estimated, so a guess would render
      identically to a billed figure
  - name: A command that emits a snapshot
    status: shipped
    note: '`basicly board --out <page>` writes `board-snapshot.json` beside the page, and `basicly board serve` serves it at `/snapshot.json`'
  - name: A rendered page a human can open
    status: shipped
    note: '`board_render.py` and `.basicly/core/templates/board/board_page.html.j2`; `basicly board --out` writes it'
  - name: A conformance kit so another project can adopt the board
    status: designed
    record: basicly-rn0o.4
    note: ''
  - name: Live modes — a snapshot on the supervisor tick, and a read-only wall view
    status: shipped
    note: '`basicly board serve` refreshes on the supervisor 15-second tick in wall mode and on `--refresh` otherwise, by its own help text'
- name: The software factory
  capabilities:
  - name: 'Requirements as a typed field, so validation has a standard to judge against'
    status: designed
    record: basicly-li8aifz
    note: Architecture D-50. Measured 2026-09-13 over 1,347 created events - 0 carry a `requirements`
      field or a `## Requirements` heading, against a positive control of 761 carrying `##
      Acceptance Criteria`. The validator's own contract names the requirement five times
  - name: Acceptance criteria read from one store rather than two
    status: designed
    record: basicly-u07bfuw
    note: Architecture D-50, migrated by corrective append under the rule section 32.8 binds -
      150 open records need a field written, and the 1,020 closed ones keep the heading as
      evidence. `plan_record.section_entries` reads the heading today, so 467 records carry a
      field nothing tests against
  - name: The two acceptance stores reconciled where they disagree
    status: designed
    record: basicly-fjvdie6
    note: Architecture D-50. Measured 2026-09-13 - 202 records carry both stores and 94 disagree;
      on basicly-17nu the heading reads `todo` while the field holds real criteria. Read rather
      than scripted, because picking a store loses the other's content
  - name: Both verification and validation fields required at the definition of ready
    status: designed
    record: basicly-zt85dgy
    note: Architecture section 32.11 and D-50. Every open record owes both the day it lands, and
      `invest.owed` already computes that list
  - name: 'A seat: one session held open across tasks and released at the cache window'
    status: designed
    record: basicly-zi8nv3a
    note: Architecture section 31A.2 and D-46. Measured 2026-09-13 on five live dispatches
      (basicly-8724lqq) - a warm session cost 0.20x and 0.19x of a fresh one on two replications
      at the same token count, because the cache write is avoided rather than tokens saved. Two
      turns per task, and the cold resume is unpriced
  - name: A declared prompt cache window per runner adapter
    status: designed
    record: basicly-ytzqz22
    note: Architecture D-46. The engine may not assume a window a host has not published; a host
      that publishes none dispatches fresh
  - name: A free seat takes the next matching ready task itself
    status: designed
    record: basicly-88jz7w8
    note: Architecture section 31A.3 and D-46. Not a second scheduler - the ready set already
      ranks and section 28.2's five conditions are already the pull predicate. It is the
      mechanism that holds a seat inside its cache window
  - name: Task to seat matching on four declared axes
    status: designed
    record: basicly-s8hxsun
    note: Architecture section 31A.6 and D-47. Three axes exist - scope globs, integrity level,
      model tier - and only the tools axis is new. The tier axis stays inert at spawn until
      basicly-a3yi lands, so a match on it reports unbound
  - name: Announcements as ledger events with a per seat watermark
    status: designed
    record: basicly-1ayiwmh
    note: Architecture section 31A.5 and D-45. One event kind and one derived watermark; no
      mailbox, no daemon, no second store. The section 8 non-goal stands for a mailbox and is
      amended for this form
  - name: Why a lane carries nine times the scope its plan declares
    status: researching
    record: basicly-awawrt3
    note: Measured 2026-09-13 over 561 claude run records - declared scope median 12,000 tokens,
      working set median 78,832, ratio 9.3x with a p90 of 27.8x, and the working set is re-read
      26.1x. Cost is the working set times the turns, so this is the largest single lever and
      its cause is unknown
  - name: The cost of resuming a seat after its cache window has closed
    status: researching
    record: basicly-w921i6b
    note: The unpriced half of D-46. Every run in basicly-8724lqq began seconds after its
      predecessor, so the cold arm of that experiment is missing and the release rule rests on
      an argument rather than a number
- name: The work graph
  capabilities:
  - name: Issues, dependencies, gate results, checkpoints and evidence in a tracked graph
    status: shipped
    note: ''
  - name: Phase derived from tracker state, so resume is a read rather than a replay
    status: shipped
    note: ''
  - name: Atomic publish of the shared export, and a store error charged to the store rather
      than to the lane's rework budget
    status: shipped
    note: ''
  - name: The scheduler score and rank recorded behind each dispatch
    status: shipped
    note: ''
  - name: A pure, age-free ranking function owned in-process
    status: shipped
    note: ''
  - name: Harness comment markers native to the owned store
    status: shipped
    note: Landed ahead of the steps before it, which is why the differential must run on dual
  - name: A repeatable ledger import a fresh consumer can run
    status: shipped
    note: Refuses a post-flip ledger
  - name: A seam-routed surface for a human tracker write, so both stores move together
    status: shipped
    note: Closes the last bypass route the differential can see
  - name: No committed artifact carries a host path, username or hostname
    status: partial
    record: basicly-vkh0.44
    note: 'The path half is shipped. **The identity half covers the running committer only,
      and both stores carry a second person''s** [measured 2026-08-17: the export holds one
      on 83 of 924 records and an address on 56; the owned log holds one on 211 of 5,616 lines
      and an address on 56, and all 263 identity-carrying events carry the import''s own marker
      against a positive control of zero live writes]. The pre-commit floor is green over
      both, correctly, because it builds its rule from the running user. Architecture §32.7.1.
      The secret-rule mirror is kept in step by convention only'
  - name: The owned append-only event log as the source of truth
    status: shipped
    note: 'The flip has happened [measured 2026-08-20: `.beads/` is absent, no engine module
      spawns the external binary, and `basicly.toml` declares one store]. What remains is
      surface cleanup rather than cutover: the `br`-shaped argv vocabulary is still the write
      seam''s input language, which is why `mirror.py` translates it'
  - name: A consistency check and rebuild, so "the log is the truth" is checkable
    status: shipped
    note: 'The "reached by nothing" note is **withdrawn as false** [measured 2026-08-20:
      `ledger-fsck` is a `[[verify.checks]]` entry declared in `basicly.d/basicly-t10ipy.toml`
      and runs on every `verify --mode full`, reporting 6,271 events over 1,022 records].
      `rebuild` is still reached by tests only, which is the honest remainder'
  - name: 'Provenance on every edge: extracted, inferred, ambiguous'
    status: partial
    record: basicly-1ep0cp
    note: 'The vocabulary collision is closed [measured 2026-08-20: 1,065 edges fold and
      `gating_edges` now returns all 1,065, up from 932]. The engine writes `engine` and
      `dual-write` into the same key this module reads as evidence strength — two axes, one
      name — and both are now recognised as declared provenance and counted apart in
      `EdgeFold.writer_labels`. What keeps this `partial` is only that `INFERRED` and
      `AMBIGUOUS` have still never been written by anything'
  - name: Cross-repo work offers as self-writes in each repository's own ledger
    status: deferred
    note: Deferred until a second repository runs the loop; today one ledger holds every
      record, so an offer has nowhere to be written and nothing would read it
