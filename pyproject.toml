[project]
name = "basicly"
dynamic = ["version"]
description = "Harness distribution and projection tooling for coding agents"
requires-python = ">=3.14"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "jinja2>=3.1.6",
  "jsonschema>=4.26.0",
  "pyyaml>=6.0",
  "rich>=13.9.0",
  "ruamel.yaml>=0.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/basicly/__init__.py"

[dependency-groups]
dev = [
  "bandit>=1.9.4",
  "djlint>=1.40.4",
  "import-linter>=2.13",
  "pip-audit>=2.10.1",
  "pre-commit>=4.6",
  "pyproject-fmt>=2.25.2",
  "pyright>=1.1.411",
  "pytest>=9.1.1",
  "pytest-xdist>=3.6",
  "ruff>=0.15.21",
  "vulture>=2.16",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
addopts = ["--import-mode=importlib"]
# Keep tmp dirs only where they are still needed — a failing test's artifacts.
# The default ("all") retains every passing test's tree too, and this suite's
# work_repo fixture copies the whole repo per test, so a green run left ~2 GB
# behind. Numbered-run retention stays at pytest's default of 3.
tmp_path_retention_policy = "failed"

[tool.pyright]
extraPaths = ["src", "."]
typeCheckingMode = "basic"

[project.scripts]
basicly = "basicly.cli:main"

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]

# Dead-code gate (basicly-uexy). The paths and confidence live on the `vulture`
# [[verify.checks]] entry in basicly.toml, beside every other check's arguments;
# only the suppression list is here, because vulture reads it from nowhere else.
#
# Each name below reproduces a finding on the tree as of 2026-08-04, and
# `.scripts/wired_or_deleted.py` fails the build when one stops reproducing, so the
# list cannot rot into a blanket exemption. `basicly-tcmy.21` is the deletion half
# that empties it — an entry is a debt, not a verdict that the name is fine.
#
# Two of them are true false positives rather than debt: `preserve_quotes` and
# `width` are assigned on a ruamel `YAML()` instance (hooks.py:280,282), which reads
# them from its own attributes, so no Python reference to either name exists to find.
#
# Matching is by bare name, which is the mechanism's limit and not a choice: an entry
# like `width` or `delta` also silences a future unused name spelled the same way
# anywhere under src/ or .scripts/. That is the strongest argument for emptying the
# list rather than adding to it.
[tool.vulture]
ignore_names = [
  "PERMISSION_TARGETS",
  "PHASES",
  "agent_context",
  "approvals",
  "baseline_failure_rate",
  "baseline_runs",
  "can_leave_classify",
  "clear_overrides",
  "config_overrides",
  "copilot",
  "delta",
  "dispatches",
  "error_tokens",
  "fallback_sort",
  "health_score",
  "landed_package_cost",
  "load_fragments",
  "per_package",
  "preserve_quotes",
  "reachable",
  "recent_failure_rate",
  "recent_runs",
  "reset_process_budget",
  "should_escalate",
  "stale_sessions",
  "tagged",
  "tags",
  "tb",
  "tone",
  "untiered_metered_runners",
  "width",
  "window_violations",
]

# Module-size ratchet (basicly-u2hl.5). The gate is `.scripts/check_module_size.py`, wired
# as the `module-size` [[verify.checks]] entry; the cap is `decompose.SCOPE_FILE_READ_CAP`
# and is imported, never respelled. Read that script's docstring for why tokens and why
# 4,000 — the short form is that it is an agent working-set gate, not a defect-density
# claim, and `docs/design/factory-loop-requirements.md` section 9.3 says which literature
# must not be cited in its support.
#
# `waiver_count` is the number of modules carrying a column-0 `module-size-waiver:` comment.
# It is here for the same reason [tool.vulture]'s ignore list is: a suppression nobody
# counts becomes a blanket exemption. The gate fails when the count and the tree disagree in
# either direction, so a waiver can be added, but only in a diff that also raises this
# number, and removing the last waiver forces it back down.
[tool.module_size]
waiver_count = 0

# The 79 modules that were already over the cap when the gate landed (2026-08-08), each at
# its measured go-live token count. A module in this list may only shrink; an entry that
# reaches the cap is deleted rather than lowered, because leaving it licenses regrowth back
# to the number below. **The list is closed** — nothing is ever added, which is what makes
# the total a debt that only falls. Nothing enforces that except the diff, and deliberately:
# an added entry here is a line a reviewer reads, which is exactly what a waiver buried in a
# 5,000-line module is not, and why the waiver count gets a ratchet and this list does not.
#
# Tests are 43 of the 79 and hold the worst offender, so they will not come down as a side
# effect of refactoring `src/`.
[tool.module_size.frozen]
