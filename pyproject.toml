[tool.hatch.build.targets.wheel]
packages = ["src/basicly"]
exclude = ["**/__pycache__", "**/*.pyc"]

# Ship the managed core catalog inside the wheel so `basicly install` can
# materialize it into a fresh consumer repo. The authoring source stays at
# `.basicly/core/` (dogfooded here); it is projected to `basicly/catalog/` in
# the built distribution only. See src/basicly/catalog.py for the locator.
[tool.hatch.build.targets.wheel.force-include]
".basicly/core" = "basicly/catalog"

[tool.uv]
package = true

# The spend-accuracy ratchet (basicly-helmej). `decompose.spend_accuracy` holds every lane's
# recorded spend forecast against its actual; a pair outside the 10x band is a finding about
# the estimator, and the recorded forecast never changes, so the finding is permanent history.
# This table banks it with the defect named, and it tracks: an entry whose pair comes back in
# band fails as graduated and must be removed in the same diff (`"<record>" = -1` under
# [ratchet.spend_accuracy.frozen] in the lane's basicly.d fragment).
[tool.spend_accuracy]
frozen_count = 1

# basicly-0cpn51: forecast 82,107,017 against 7,318,875 spent (0.089x). The estimator applies
# one median spend-per-working-set ratio (282 over 155 lanes) to a working set 8x the median;
# the largest lane in the ledger ran at 32. basicly-yjmxjz owns the estimator; when it lands and
# the pair re-derives in band, this entry graduates.
# basicly-rv7q88: forecast 11,610,753 against 1,025,735 spent (0.088x). The other direction of
# the same defect. Its scope read 12,598 tokens - five documentation files - and the `task`
# build factor of 3.0 carried it to 11.6M; that factor is a declared seed and has never been
# measured, which `basicly loop preflight` prints on every pass as `factors: all seeds`. The
# same seed priced basicly-3iaw0x at 36,324,238 against the 54,205,369 it burned before timing
# out, so it is wrong high on a small lane and low on a large one. basicly-yjmxjz owns the
# estimator; when it lands and the pair re-derives in band, this entry graduates.
# basicly-e1c4pct: 8,779,815 spent against a forecast of 793,059 (11.071x). A third instance of
# the same estimator defect, in the greenfield direction neither entry above covers: the lane's
# scope named `src/basicly/board_icons.py` and `tests/test_board_icons.py`, and neither existed
# when it was sized, so `scope_read_cost` measured 4,105 tokens for a lane that went on to write
# 557 lines. `basicly loop preflight` printed the tell and it was read as a size judgment rather
# than as a missing measurement: `under the floor - dispatches, but merge it with a sibling`.
# basicly-yjmxjz owns the estimator; when it lands and the pair re-derives in band, this entry
# graduates.
[tool.spend_accuracy.frozen]
"basicly-0cpn51" = 1
"basicly-e1c4pct" = 1
"basicly-rv7q88" = 1
