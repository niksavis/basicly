# Suppression-debt ratchet (basicly-u2hl.12). The gate is `.scripts/check_noqa_debt.py`,
# wired as the `noqa-debt` [[verify.checks]] entry. Read that script's docstring for why a
# suppression needs a count kept outside the code, and why the directives are read from
# `tokenize` comments rather than by substring — `src/basicly/tracker.py:70` is a comment that
# looks like a suppression, suppresses nothing, and ruff only warns about.
#
# `unreasoned_count` is how many suppressions carry no reason after their code, against the
# house form `# noqa: CODE - reason`. It is here for the same reason [tool.module_size]'s
# `waiver_count` is, and fails in both directions: an unargued suppression cannot appear,
# and cannot be swapped for another, in a diff that does not touch this file.
[tool.noqa_debt]
unreasoned_count = 7

# Every code suppressed in this tree at the count it stood at when the gate landed
# (2026-08-08, 76 across `src`, `tests`, `.scripts` and `.basicly/core`). Unlike
# [tool.module_size.frozen] this list is *not* closed — adopting a new rule family
# legitimately introduces a code — but a code absent from it is refused until someone adds
# the line, which is what makes each new suppression a reviewer-visible decision instead of
# one comment inside a 5,000-line module.
#
# A count that falls has to be banked in the same diff. Leaving the higher number would
# license regrowth back to it for free, which is the fail-open shape the module-size ratchet
# names; an entry that reaches zero is deleted rather than set to 0.
#
# Banked as a delta in the lane's own `basicly.d/<bead-id>.toml`, not by editing a line here:
# `[ratchet.noqa_debt.frozen] S603 = +1` for a suppression added, `-1` for one removed, and
# the gate sums them onto this base. Three of five lanes bounced on this table and
# `[[verify.checks]]` on 2026-08-08 before that existed (basicly-ef7t).
#
# `S603`/`S607` (21 of the 76) are the subprocess pair, and `PLR0913` (32) is argument count
# on functions that mirror the CLI surface. Both are debts with a decomposition track behind
# them, not lines to shave off the next commit.
[tool.noqa_debt.frozen]
A002 = 2
ARG001 = 2
BLE001 = 3
E402 = 6
E731 = 1
PLC0415 = 5
PLR0911 = 2
PLR0913 = 32
S105 = 2
S603 = 15
S607 = 6
S701 = 1
UP017 = 1
[tool.corpus_drift.frozen]
"basicly-u2hl" = 4

# Stale-citation debt (basicly-miqr). The gate is `.scripts/check_docs_citations.py`, wired as
# the `docs-citations` [[verify.checks]] entry. A `file.py:line` in a document is a claim about
# the code that a planner reads as fact, and until this gate nothing checked one: four such
# claims planned a P0 against a remedy the tree had already replaced.
#
# **The list is closed and now empty** — no document may carry a single stale citation. The last
# entry was `work-tracker.md ×1`, `runner.py:2546` past end-of-file; it graduated at 0 the same way
# architecture.md did, by replacing the `file:line` with the symbol name (`runner.StallWatchdog`),
# which is what the gate's second rule wants anyway.
#
# A count that falls has to be banked in the same diff and an entry that reaches zero is
# deleted, for the reason [tool.module_size.frozen] states: leaving the higher number licenses
# regrowth back to it for free.
[tool.docs_citations.frozen]

# `fsck` findings in .basicly/ledger that are known and cannot be repaired, keyed
# <record>/<finding kind> so an allowance for one defect cannot absorb a different defect
# landing on the same record. `.scripts/check_ledger_fsck.py` binds on everything else.
#
# The one entry is a lost event: basicly-vkh0.30 claims sequences 1-8 and 10-34, and no
# commit in this repository's history ever contained a line at sequence 9 (probed with
# sequences 8 and 10 as the positive control). §4.1's writer assigns max+1, so the line was
# written and lost before it was committed. An append-only log has no undelete, so unlike
# [tool.docs_citations.frozen] this entry can never fall to zero by repair — it falls only if
# the log is ever rebuilt from a source that still has the event.
[tool.ledger_fsck.frozen]
"basicly-vkh0.30/sequence-gap" = 1
# Citations nothing can check, per document (basicly-v5c8ob). The rule above only runs when the
# citing sentence names a top-level symbol of the module it cites; 32 of the 44 citations in
# `docs/` name none, so they were counted, reported as a coverage share, and passed. A gate that
# exits zero over a claim it did not read is the fail-open shape, and it was probed: a sentence
# citing a real module at line 1 with a false claim about what is there was one of the 32.
#
# So the 32 are debt and a new one is refused. The repair is to name the symbol the sentence is
# actually talking about, which is the same repair the frozen table above asks for and the
# reason that table is now empty. The list is closed and each count may only fall, banked in
# the same diff, for the reason [tool.module_size.frozen] states: leaving the higher number
# licenses regrowth back to it for free.
[tool.docs_citations.unverifiable]

[tool.code_citations]
binding_count = 3

[tool.code_citations.bindings]
# Which document a *bare* section mark in a directory means (basicly-e2mz.49). The shipped
# tracker kit is the case that forced this: each module names its own `SPEC.md` in its header
# once and then writes bare marks, so 113 of them could be attributed to no document by any
# reader who opened one module in isolation - or by any gate. One line here makes all 113
# checkable. Longest matching prefix wins; a key that is a full path binds one module.
#
# `binding_count` ratchets this table in both directions, because a binding added quietly is
# the one edit that could make a whole directory's marks resolve against a document nobody
# chose - the fail-open shape, arriving through a green gate.
".basicly/core/kit/tracker/" = ".basicly/core/kit/tracker/SPEC.md"
#
# Two more, both added 2026-08-20 when this gate first ran on a rebase and caught citations
# `basicly-u2hl.59` had just landed. `handoff.py`'s bare marks originally meant the
# factory-loop requirements document's `Handoff artifact schemas [D4]`; `basicly-1hp91f`
# absorbed that document into the architecture (§33, `Handoff artifacts and their
# contracts`) and repointed the marks, so the binding now names the architecture.
# Bound rather than named inline because `handoff.py` has 9 tokens of module-size headroom and
# spelling the path on the citing lines costs about 24.
#
# A fourth, 2026-08-28 (basicly-vkh0.42.13): `write_verbs.py` cites the provenance
# vocabulary, which left `docs/requirements/work-tracker.md` for the kit's own `SPEC.md`
# when that document was deleted. Bound rather than named inline for `handoff.py`'s reason
# measured again here - 13 tokens of module-size headroom against about 24 for the path.

# Unresolved code-to-document citation debt (basicly-e2mz.49). The gate is
# `.scripts/check_code_citations.py`, wired as the `code-citations` [[verify.checks]] entry. A
# section mark in a comment or a docstring is a pointer into a requirements document, and
# `docs-citations` only ever ran the other direction: 220 of the 370 marks measured on
# 2026-08-20 reach no heading. Two of those were the live findings the gate landed with, and
# basicly-fsuhg3 repaired both by finding the target rather than deleting the reference:
# `tests/test_policy.py` cited `gates-and-rework-design.md`, absorbed and deleted 2026-08-08
# into `factory-loop.md` (itself absorbed into the architecture and deleted, basicly-1hp91f),
# and the shipped tracker kit's `events.py` cited three architecture
# sections while naming its own source document. Both entries graduated at zero.
#
# The list is closed - a module absent from it may carry no unresolved mark. A count that
# falls has to be banked in the same diff and an entry that reaches zero is deleted, for the
# reason [tool.module_size.frozen] states: leaving the higher number licenses regrowth back
# to it for free.

[tool.code_citations.frozen]
".scripts/check_test_naming.py" = 1
".scripts/docs_claim_status.py" = 1
"tests/test_docs_claim_status.py" = 1
# Release-note debt, as a per-record ratchet (basicly-7phc). The gate is
# `.scripts/check_release_notes.py`, wired as the `release-notes` [[verify.checks]] entry and
# folded into `release.blocking_reasons`. `changelog.d` refuses a fragment that is empty or
# misnamed, so every check it had bound on a fragment that *exists*; nothing bound on a closed
# record that produced none, and 19 of the 54 records closed for v0.9.0 were in that state —
# including the seven specialist agents and five loop skills `basicly install` vendors. The
# release workflow reads CHANGELOG.md from the tagged commit, so the note is unrecoverable
# once the tag exists.
#
# `declared_count` is how many records are declared invisible to a consumer below. It is here
# for the same reason [tool.module_size]'s `waiver_count` is: the frozen list is closed and
# only ever shrinks, so a declaration is the one way this gate's exemption surface can grow,
# and it may not grow in a diff that does not say so.
[tool.release_notes]
declared_count = 1

# Records whose change no consumer can see, each with the reason. The declaration exists so
# the gate does not train people to write empty fragments, and it is validated against the
# population it exempts from: an entry naming a record the tracker does not hold, or one that
# is not closed, or one that owes no note anyway, or one that already has a note, fails as
# stale. An empty reason fails as an empty fragment does. Adding one is two edits — the entry
# here and `count_delta = +1` under [ratchet.release_notes] in the lane's own basicly.d
# fragment — for the reason every ratchet number is a delta.
[tool.release_notes.invisible]
"basicly-3mr2zg" = "the v0.10.0 release record: its change is the CHANGELOG section and the tag themselves, so a note about the release inside the release describes nothing"
"basicly-uhiq" = "epic anchor: each of its four children shipped its own change and note; the epic itself changed no file and closed 2026-08-28 as complete, its rule carried forward by basicly-hnnmk9"
"basicly-ibzr0f" = "test-only: the lane found basicly-gnpgf8 had already removed the labelled empty rows from a lane card, and added one regression test; no consumer surface changed"
"basicly-xgk9v0" = "investigation only: the one defect it named, the absent lanes section, shipped under basicly-u6eeag with its own note; the remaining sections read a git-ignored store by a design basicly-y754k2 records, so no file of its declared scope changed"
"basicly-vowpbar" = "duplicate, closed with no work: basicly-62h3x9 had carried a superset of its criteria since 2026-08-28, and this record closed the hour it was filed with no commit in its worktree"
"basicly-tkbmndn" = "built inside basicly-igqm86l, whose note names the runner ceiling in the same sentence as the mid-lane kill it replaces; the two halves are one change and two notes would tell a consumer they got two"

# The 145 closed records that declared a scope reaching a shipped surface and produced no
# release note when the gate landed (2026-08-20). Measured over the whole tracker: 984
# records, 244 open, 740 closed; of the closed, 435 declare no backticked `## Scope` and are
# not judged at all, 42 declare machinery only, 118 already have a note and these 145 do not.
# Every one of them closed through a green gate, which is why this is a ratchet and not a cap.
#
# Each entry is 1 because a record owes at most one note, and `may_only = "track"` — the
# record must *equal* the tree, exactly as [tool.noqa_debt.frozen] does. So an entry whose
# record gained a note, or that was reopened, fails rather than sitting stale; banking it is
# `"<record-id>" = -1` under [ratchet.release_notes.frozen] in the lane's own basicly.d
# fragment. That is also what closes the reopen hole: the exemption cannot survive rework,
# because both repairs remove it and the re-close is then refused.
#
# The list is closed — an entry is only ever removed. A released record keeps its entry: it
# can never gain a note (assembly deleted the fragment), so nothing about it will change
# again, and the entry is the record of what shipped unannounced.
[tool.release_notes.frozen]
