applies_to: [all]
tags: [commands, build, test]
status: active
title: Commands
body: |
  Run these commands as written.

  Setup:

  ```sh
  uv sync --group dev
  uv run python src/basicly/lefthook_artifacts.py --download
  uv run basicly hooks-build
  ```

  While editing, run the affected test file (example):

  ```sh
  uv run pytest tests/test_cli.py -q
  ```

  Before a local commit, verify the staged changes; it runs lint, format and type checks, so do not repeat them repository-wide:

  ```sh
  uv run basicly verify --mode staged --affected
  ```

  Full verification runs in CI only. Do not run the full suite locally on routine edits or integration.

  After editing catalog sources, run the projection checks that `catalog-authoring` lists, each with `uv run`.
