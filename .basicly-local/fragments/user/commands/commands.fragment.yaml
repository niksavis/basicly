schema_version: 1
id: commands
description: Verbatim-runnable commands for everyday development.
category: commands
priority: high
applies_to: [all]
tags: [commands, build, test]
status: active
title: Commands
body: |
  Run these commands as written.

  Setup:

  ```sh
  uv sync --group dev
  uv run python src/basicly/lefthook_artifacts.py --download
  uv run basicly hooks-build
  ```

  While editing, run the affected test file (example):

  ```sh
  uv run pytest tests/test_cli.py -q
  ```

  On the integrated candidate, run required full verification:

  ```sh
  uv run basicly verify --mode full
  ```

  Lint / format:

  ```sh
  uv run ruff check
  uv run ruff format --check
  ```

  Projection gates (after editing catalog sources):

  ```sh
  uv run basicly check
  uv run basicly skills-check
  uv run basicly styles-check
  uv run basicly agents-check
  uv run basicly hooks-check
  uv run basicly permissions-check
  ```
