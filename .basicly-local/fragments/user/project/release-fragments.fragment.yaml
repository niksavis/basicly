# yaml-language-server: $schema=../../../../.basicly/core/schemas/fragment.schema.json
schema_version: 1
token_cost:
  claude: 0
  codex: 0
  copilot: 0
id: release-fragments
description: Write a release note fragment for every change a consumer can see.
category: project
priority: medium
applies_to: [all]
tags:
- release
status: active
scope:
  paths:
  - changelog.d/**
  - src/**
  - .basicly/core/**
title: Release Fragments
body: |
  - Include `changelog.d/<record-id>.<category>.md` with each consumer-visible change before closing: one bullet under 400 characters, e.g. `basicly-a3ab.4.changed.md`.
  - Releases read the tagged commit. A closed shipped record without its fragment blocks the next main commit.
