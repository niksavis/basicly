<!doctype html><html><head><style>
 body { margin:0 }
 .hidden-box { height:40px; overflow:hidden; border:1px solid #333 }
 .scrolls    { height:40px; overflow:auto;   border:1px solid #333 }
 .ellipsis   { width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
</style></head><body>
 <div class="hidden-box">one<br>two<br>three<br>four<br>five<br>six</div>
 <div class="scrolls">one<br>two<br>three<br>four<br>five<br>six</div>
 <div class="ellipsis">a title far too long to fit inside this narrow box at all</div>
</body></html>
